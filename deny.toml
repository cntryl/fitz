[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Transitive through cntryl-midge cloud-gcp for GCS service-account signing; no patched rsa release exists. Remove when Midge migrates to a fixed signing backend." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "LicenseRef-Fitz-Source-License-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "fitz"
expression = "LicenseRef-Fitz-Source-License-1.0"
license-files = [
    { path = "LICENSE", hash = 0x1bb858be },
]

[[licenses.clarify]]
crate = "cntryl-lexkey"
expression = "Apache-2.0"
license-files = [
    { path = "LICENSE", hash = 0x251d91a7 },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/cntryl/lexkey-rs",
    "https://github.com/cntryl/midge",
    "https://github.com/cntryl/stress",
]
