#
# Fitz Message Broker + Peas - local development only
#
# This file is a loopback-only example for local development with the Peas emulator.
# It is not a production deployment manifest.
# Cloud-backed local brokers may restart briefly while writer leases settle;
# wait for /readyz instead of expecting immediate first-boot readiness.
#
name: fitz-cloud

x-broker-common: &broker-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  stop_grace_period: 15s
  healthcheck:
    disable: true

x-broker-common-env: &broker-common-env
  FITZ_STORAGE_MODE: "cloud"
  FITZ_STORAGE_PROVIDER: "${FITZ_PEAS_PROVIDER:-peas-s3}"
  FITZ_STORAGE_ENDPOINT: "http://peas:9000"
  FITZ_STORAGE_CLOUD_DURABILITY: "${FITZ_STORAGE_CLOUD_DURABILITY:-background}"
  RUST_LOG: "info,fitz=trace"

services:
  peas:
    container_name: peas
    hostname: peas
    image: ghcr.io/sqrzl/peas-emulator:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      BLOBS_PATH: /app/blobs
      ACCESS_KEY_ID: admin
      SECRET_ACCESS_KEY: easy-peasy
    volumes:
      - peas_blobs:/app/blobs

  fitz-auth:
    <<: *broker-common
    container_name: fitz-auth
    depends_on:
      - peas
    ports:
      - "127.0.0.1:${FITZ_AUTH_HOST_HTTP_PORT:-4090}:${FITZ_AUTH_HTTP_PORT:-4090}"
      - "127.0.0.1:${FITZ_AUTH_HOST_TCP_PORT:-4091}:${FITZ_AUTH_TCP_PORT:-4091}"
    environment:
      <<: *broker-common-env
      FITZ_AUTH_REQUIRED: "true"
      FITZ_ADMIN_AUTH_MODE: "open"
      FITZ_HTTP_PORT: "${FITZ_AUTH_HTTP_PORT:-4090}"
      FITZ_TCP_PORT: "${FITZ_AUTH_TCP_PORT:-4091}"
      FITZ_JWT_HMAC_SECRET: "${FITZ_JWT_HMAC_SECRET:-dev-test-secret}"
      FITZ_JWT_AUDIENCE: "fitz"
      FITZ_ROUTE_FAMILY_MAP: "dev=1"
      FITZ_WS_ALLOWED_ORIGINS: "http://localhost:${FITZ_AUTH_HOST_HTTP_PORT:-4090},http://127.0.0.1:${FITZ_AUTH_HOST_HTTP_PORT:-4090}"
      FITZ_STORAGE_BUCKET: "${FITZ_AUTH_STORAGE_BUCKET:-fitz-auth}"
      FITZ_STORAGE_CONTAINER: "${FITZ_AUTH_STORAGE_CONTAINER:-fitz-auth}"
      FITZ_STORAGE_PREFIX: "${FITZ_AUTH_STORAGE_PREFIX:-dev-auth}"
      FITZ_STORAGE_CACHE_PATH: "/tmp/fitz-cloud-cache/auth"

  fitz-anon:
    <<: *broker-common
    container_name: fitz-anon
    depends_on:
      - peas
    ports:
      - "127.0.0.1:${FITZ_ANON_HOST_HTTP_PORT:-4190}:${FITZ_ANON_HTTP_PORT:-4090}"
      - "127.0.0.1:${FITZ_ANON_HOST_TCP_PORT:-4191}:${FITZ_ANON_TCP_PORT:-4091}"
    environment:
      <<: *broker-common-env
      FITZ_AUTH_REQUIRED: "false"
      FITZ_ADMIN_AUTH_MODE: "open"
      FITZ_HTTP_PORT: "${FITZ_ANON_HTTP_PORT:-4090}"
      FITZ_TCP_PORT: "${FITZ_ANON_TCP_PORT:-4091}"
      FITZ_STORAGE_BUCKET: "${FITZ_ANON_STORAGE_BUCKET:-fitz-anon}"
      FITZ_STORAGE_CONTAINER: "${FITZ_ANON_STORAGE_CONTAINER:-fitz-anon}"
      FITZ_STORAGE_PREFIX: "${FITZ_ANON_STORAGE_PREFIX:-dev-anon}"
      FITZ_STORAGE_CACHE_PATH: "/tmp/fitz-cloud-cache/anon"

volumes:
  peas_blobs:
