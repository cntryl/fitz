version: '3.8'
# Note: runtime image doesn't include a shell or network utilities (wget/curl),
# so in-container healthchecks were removed. If you want container health checks
# with a scratch-like image, either:
#  - add a lightweight HTTP probe sidecar/checker service that queries the
#    container's HTTP endpoint from the network, or
#  - build a tiny probe binary into the image (or include curl/wget), or
#  - rely on external orchestration health checks (k8s readiness/liveness).

services:
  control:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: fitz-control
    hostname: fitz-control
    ports:
      - "8080:8080" # control HTTP port (mapped to container 8080)
    environment:
      FITZ_WS_PORT: "8080"
      FITZ_TCP_PORT: "7071"
      CONTROL_ROUTE: "self"
      BROKER_ENFORCE_AUTHZ: "false"
      RUST_LOG: "info,fitz=debug"
    restart: unless-stopped

  broker-1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: fitz-broker-1
    hostname: fitz-broker-1
    ports:
      - "8081:8080"
    environment:
      FITZ_WS_PORT: "8080"
      FITZ_TCP_PORT: "7072"
      CONTROL_ROUTE: "http://fitz-control:8080/connect"
      CONTROL_CLIENT_ID: "broker-1"
      BROKER_ENFORCE_AUTHZ: "false"
      RUST_LOG: "info,fitz=debug"
    depends_on:
      - control
    restart: unless-stopped

  broker-2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: fitz-broker-2
    hostname: fitz-broker-2
    ports:
      - "8082:8080"
    environment:
      FITZ_WS_PORT: "8080"
      FITZ_TCP_PORT: "7073"
      CONTROL_ROUTE: "http://fitz-control:8080/connect"
      CONTROL_CLIENT_ID: "broker-2"
      BROKER_ENFORCE_AUTHZ: "false"
      RUST_LOG: "info,fitz=debug"
    depends_on:
      - control
    restart: unless-stopped

  broker-3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: fitz-broker-3
    hostname: fitz-broker-3
    ports:
      - "8083:8080"
    environment:
      FITZ_WS_PORT: "8080"
      FITZ_TCP_PORT: "7074"
      CONTROL_ROUTE: "http://fitz-control:8080/connect"
      CONTROL_CLIENT_ID: "broker-3"
      BROKER_ENFORCE_AUTHZ: "false"
      RUST_LOG: "info,fitz=debug"
    depends_on:
      - control
    restart: unless-stopped

networks:
  default:
    driver: bridge
