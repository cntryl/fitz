#
# Peas storage emulator - local development only
#
# This file is a loopback-only example for local development.
# It is not a production deployment manifest.
#
name: peas
services:
  peas:
    container_name: peas
    hostname: peas
    image: ghcr.io/sqrzl/peas-emulator:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      BLOBS_PATH: /app/blobs
      ACCESS_KEY_ID: admin
      SECRET_ACCESS_KEY: easy-peasy
    volumes:
      - peas_blobs:/app/blobs

volumes:
  peas_blobs:
