components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fitz_admin_session
      description: Admin session JWT cookie issued by `POST /api/v1/session`.

  parameters:
    RealmPath:
      name: realm
      in: path
      required: true
      schema:
        type: string
    AreaPath:
      name: area
      in: path
      required: true
      schema:
        type: string
    ResourcePath:
      name: resource
      in: path
      required: true
      schema:
        type: string
    OperationPath:
      name: operation
      in: path
      required: true
      schema:
        type: string
    RealmQuery:
      name: realm
      in: query
      required: false
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 20
        minimum: 1
        maximum: 50
    FamilyQuery:
      name: family
      in: query
      required: false
      schema:
        type: integer
        format: int64
    AgainstRealmQuery:
      name: against_realm
      in: query
      required: true
      schema:
        type: string
    AgainstAreaQuery:
      name: against_area
      in: query
      required: true
      schema:
        type: string
    AgainstResourceQuery:
      name: against_resource
      in: query
      required: true
      schema:
        type: string
    AgainstFamilyQuery:
      name: against_family
      in: query
      required: false
      schema:
        type: integer
        format: int64

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ReadyStatus:
      type: object
      properties:
        status:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
      required: [status, checks]

    StartupStatus:
      type: object
      properties:
        status:
          type: string
        startup_time_seconds:
          type: number
      required: [status, startup_time_seconds]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    SessionResponse:
      type: object
      required: [authenticated, username]
      properties:
        authenticated:
          type: boolean
        username:
          type: string

    DiagnosticTrend:
      type: string
      enum: [growing, shrinking, steady, stalled, unknown]

    DiagnosticSeverity:
      type: string
      enum: [informational, low, medium, high, critical]

    IncidentStatus:
      type: string
      enum: [healthy, degraded, stalled, recovering, unknown]

    DiagnosticSnapshot:
      type: object
      required:
        [
          current_stage,
          trend,
          severity,
          recent_transition_count,
          failure_count,
          contention_count,
          waiter_count,
          confidence,
          explanation_hints,
        ]
      properties:
        current_stage:
          type: string
        trend:
          $ref: "#/components/schemas/DiagnosticTrend"
        severity:
          $ref: "#/components/schemas/DiagnosticSeverity"
        likely_bottleneck:
          type: [string, "null"]
        last_changed_at:
          type: [string, "null"]
        last_success_at:
          type: [string, "null"]
        last_failure_at:
          type: [string, "null"]
        age_seconds:
          type: [integer, "null"]
          format: int64
        recent_transition_count:
          type: integer
          format: int64
        failure_count:
          type: integer
          format: int64
        contention_count:
          type: integer
          format: int64
        waiter_count:
          type: integer
        confidence:
          type: number
        explanation_hints:
          type: array
          items:
            type: string
        delta_5m:
          type: [integer, "null"]
          format: int64
        delta_1h:
          type: [integer, "null"]
          format: int64

    IncidentSummary:
      type: object
      required: [status, title, severity, confidence, explanation]
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatus"
        title:
          type: string
        likely_bottleneck:
          type: [string, "null"]
        severity:
          $ref: "#/components/schemas/DiagnosticSeverity"
        confidence:
          type: number
        explanation:
          type: string
        recommended_next_query:
          type: [string, "null"]

    DiagnosticHotspot:
      allOf:
        - $ref: "#/components/schemas/DiagnosticSnapshot"
        - type: object
          required: [domain]
          properties:
            domain:
              type: string
            realm:
              type: [string, "null"]
            area:
              type: [string, "null"]
            resource:
              type: [string, "null"]
            operation:
              type: [string, "null"]
            family:
              type: [integer, "null"]
              format: int64
            backlog:
              type: [integer, "null"]
              format: int64
            inflight:
              type: [integer, "null"]
              format: int64
            ready:
              type: [integer, "null"]
              format: int64
            delayed:
              type: [integer, "null"]
              format: int64
            dead_letters:
              type: [integer, "null"]
              format: int64
            workers:
              type: [integer, "null"]
              format: int64
            subscriptions:
              type: [integer, "null"]
              format: int64
            owner_session:
              type: [string, "null"]
            worker_session:
              type: [string, "null"]

    GlobalTroubleshootingDiagnostics:
      type: object
      required: [incident_summary, hotspots]
      properties:
        incident_summary:
          $ref: "#/components/schemas/IncidentSummary"
        top_bottleneck:
          $ref: "#/components/schemas/DiagnosticHotspot"
        last_significant_transition_at:
          type: [string, "null"]
        hotspots:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticHotspot"

    ResourceTimelineKind:
      type: string
      enum: [observation, transition, failure, retry, ownership_change, state_flip, registration]

    ResourceTimelineEvent:
      type: object
      required: [domain, kind, observed_at, summary, realm, area, resource]
      properties:
        domain:
          type: string
        kind:
          $ref: "#/components/schemas/ResourceTimelineKind"
        observed_at:
          type: string
        summary:
          type: string
        realm:
          type: string
        area:
          type: string
        resource:
          type: string
        operation:
          type: [string, "null"]
        family:
          type: [integer, "null"]
          format: int64
        age_seconds:
          type: [integer, "null"]
          format: int64
        owner_session:
          type: [string, "null"]
        worker_session:
          type: [string, "null"]
        correlation_id:
          type: [string, "null"]
        message_id:
          type: [integer, "null"]
          format: int64
        attempts:
          type: [integer, "null"]
          format: int64

    ResourceTimeline:
      type: object
      required: [domain, realm, area, resource, derived, limit, diagnostics, events]
      properties:
        domain:
          type: string
        realm:
          type: string
        area:
          type: string
        resource:
          type: string
        family:
          type: [integer, "null"]
          format: int64
        derived:
          type: boolean
        limit:
          type: integer
          format: int64
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"
        events:
          type: array
          items:
            $ref: "#/components/schemas/ResourceTimelineEvent"

    ResourceComparisonScope:
      type: object
      required: [realm, area, resource]
      properties:
        realm:
          type: string
        area:
          type: string
        resource:
          type: string
        family:
          type: [integer, "null"]
          format: int64

    ResourceComparisonMetrics:
      type: object
      properties:
        backlog:
          type: [integer, "null"]
          format: int64
        inflight:
          type: [integer, "null"]
          format: int64
        ready:
          type: [integer, "null"]
          format: int64
        delayed:
          type: [integer, "null"]
          format: int64
        dead_letters:
          type: [integer, "null"]
          format: int64
        workers:
          type: [integer, "null"]
          format: int64
        subscriptions:
          type: [integer, "null"]
          format: int64
        waiters:
          type: [integer, "null"]
          format: int64
        age_seconds:
          type: [integer, "null"]
          format: int64
        recent_transition_count:
          type: [integer, "null"]
          format: int64
        failure_count:
          type: [integer, "null"]
          format: int64
        contention_count:
          type: [integer, "null"]
          format: int64
        operations_total:
          type: [integer, "null"]
          format: int64

    ResourceComparisonSide:
      type: object
      required: [scope, diagnostics, metrics]
      properties:
        scope:
          $ref: "#/components/schemas/ResourceComparisonScope"
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"
        metrics:
          $ref: "#/components/schemas/ResourceComparisonMetrics"

    ResourceComparisonDelta:
      type: object
      properties:
        backlog:
          type: [integer, "null"]
          format: int64
        inflight:
          type: [integer, "null"]
          format: int64
        ready:
          type: [integer, "null"]
          format: int64
        delayed:
          type: [integer, "null"]
          format: int64
        dead_letters:
          type: [integer, "null"]
          format: int64
        workers:
          type: [integer, "null"]
          format: int64
        subscriptions:
          type: [integer, "null"]
          format: int64
        waiters:
          type: [integer, "null"]
          format: int64
        age_seconds:
          type: [integer, "null"]
          format: int64
        recent_transition_count:
          type: [integer, "null"]
          format: int64
        failure_count:
          type: [integer, "null"]
          format: int64
        contention_count:
          type: [integer, "null"]
          format: int64
        operations_total:
          type: [integer, "null"]
          format: int64

    ResourceComparison:
      type: object
      required: [domain, comparison_mode, derived, left, right, delta, summary]
      properties:
        domain:
          type: string
        comparison_mode:
          type: string
        derived:
          type: boolean
        left:
          $ref: "#/components/schemas/ResourceComparisonSide"
        right:
          $ref: "#/components/schemas/ResourceComparisonSide"
        delta:
          $ref: "#/components/schemas/ResourceComparisonDelta"
        summary:
          type: string

    GlobalStats:
      type: object
      required: [broker, domains, diagnostics]
      properties:
        broker:
          $ref: "#/components/schemas/BrokerStats"
        domains:
          $ref: "#/components/schemas/DomainStats"
        diagnostics:
          $ref: "#/components/schemas/GlobalTroubleshootingDiagnostics"

    BrokerStats:
      type: object
      required:
        [uptime_seconds, connections, sessions, realms, messages_per_second]
      properties:
        uptime_seconds:
          type: integer
        connections:
          type: integer
        sessions:
          type: integer
        realms:
          type: array
          items:
            type: string
        messages_per_second:
          type: number

    DomainStats:
      type: object
      required: [kv, stream, notice, queue, rpc, lease, schedule]
      properties:
        kv:
          $ref: "#/components/schemas/KvStats"
        stream:
          $ref: "#/components/schemas/StreamStats"
        notice:
          $ref: "#/components/schemas/NoticeStats"
        queue:
          $ref: "#/components/schemas/QueueStats"
        rpc:
          $ref: "#/components/schemas/RpcStats"
        lease:
          $ref: "#/components/schemas/LeaseStats"
        schedule:
          $ref: "#/components/schemas/ScheduleStats"

    KvStats:
      type: object
      required: [transactions_active, keys_total, operations_per_second, diagnostics]
      properties:
        transactions_active:
          type: integer
        keys_total:
          type: integer
        operations_per_second:
          type: number
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    StreamStats:
      type: object
      required:
        [
          streams_active,
          events_total,
          operations_per_second,
          subscriptions_active,
          diagnostics,
        ]
      properties:
        streams_active:
          type: integer
        events_total:
          type: integer
        operations_per_second:
          type: number
        subscriptions_active:
          type: integer
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    NoticeStats:
      type: object
      required: [subscriptions_active, publishes_per_second, diagnostics]
      properties:
        subscriptions_active:
          type: integer
        publishes_per_second:
          type: number
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    QueueStats:
      type: object
      required:
        [
          messages_ready,
          messages_delayed,
          messages_pending,
          messages_dead_lettered,
          inflight_active,
          requests_total,
          success_total,
          failure_total,
          enqueues_total,
          reserves_total,
          completes_total,
          releases_total,
          extends_total,
          operations_per_second,
          diagnostics,
        ]
      properties:
        messages_ready:
          type: integer
        messages_delayed:
          type: integer
        messages_pending:
          type: integer
        messages_dead_lettered:
          type: integer
        inflight_active:
          type: integer
        requests_total:
          type: integer
          format: int64
        success_total:
          type: integer
          format: int64
        failure_total:
          type: integer
          format: int64
        enqueues_total:
          type: integer
          format: int64
        reserves_total:
          type: integer
          format: int64
        completes_total:
          type: integer
          format: int64
        releases_total:
          type: integer
          format: int64
        extends_total:
          type: integer
          format: int64
        operations_per_second:
          type: number
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    RpcStats:
      type: object
      required: [workers_registered, requests_pending, operations_per_second, diagnostics]
      properties:
        workers_registered:
          type: integer
        requests_pending:
          type: integer
        operations_per_second:
          type: number
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    LeaseStats:
      type: object
      required: [leases_active, operations_per_second, diagnostics]
      properties:
        leases_active:
          type: integer
        operations_per_second:
          type: number
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    ScheduleStats:
      type: object
      required:
        [
          schedules_active,
          executions_per_minute,
          subscriptions_active,
          pending_fire_claims,
          notify_failures_total,
          ack_failures_total,
          overdue_normalizations_total,
          diagnostics,
        ]
      properties:
        schedules_active:
          type: integer
        executions_per_minute:
          type: number
        subscriptions_active:
          type: integer
        pending_fire_claims:
          type: integer
        notify_failures_total:
          type: integer
        ack_failures_total:
          type: integer
        overdue_normalizations_total:
          type: integer
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    RealmEntry:
      type: object
      required: [realm]
      properties:
        realm:
          type: string
    RealmCollection:
      type: object
      required: [realms]
      properties:
        realms:
          type: array
          items:
            $ref: "#/components/schemas/RealmEntry"
    RealmDetail:
      type: object
      required: [realm]
      properties:
        realm:
          type: string

    AreaEntry:
      type: object
      required: [area]
      properties:
        area:
          type: string
    AreaCollection:
      type: object
      required: [realm, areas]
      properties:
        realm:
          type: string
        areas:
          type: array
          items:
            $ref: "#/components/schemas/AreaEntry"
    AreaDetail:
      type: object
      required: [realm, area]
      properties:
        realm:
          type: string
        area:
          type: string

    ResourceEntry:
      type: object
      required: [resource]
      properties:
        resource:
          type: string
    ResourceCollection:
      type: object
      required: [realm, area, resources]
      properties:
        realm:
          type: string
        area:
          type: string
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceEntry"

    KvResourceDetail:
      type: object
      description: Durable KV committed data exists separately from this admin view. This resource detail describes only the current broker process's live in-memory transaction activity for the resource. `transactions_active` counts active session-scoped transactions and resets after disconnect cleanup or broker restart.
      required: [realm, area, resource, transactions_active, diagnostics]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        transactions_active:
          type: integer
          description: Broker-local count of active in-memory KV transactions for this resource. This is not a durable recovery handle and resets on disconnect cleanup or broker restart.
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    QueueResourceDetail:
      type: object
      description: Point-in-time Queue resource detail for the current broker process. Counts describe only the queue actor state currently warm in memory and do not represent a durable inventory of every committed queue in storage.
      required:
        [
          realm,
          area,
          resource,
          messages_ready,
          messages_delayed,
          messages_inflight,
          messages_dead_lettered,
          messages_total,
          oldest_message_age_seconds,
          diagnostics,
        ]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        messages_ready: { type: integer }
        messages_delayed: { type: integer }
        messages_inflight: { type: integer }
        messages_dead_lettered: { type: integer }
        messages_total: { type: integer }
        oldest_message_age_seconds: { type: integer }
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    StreamResourceDetail:
      type: object
      description: Durable committed stream metadata for one resource plus the current broker process's live append-session count. `offset`, `watermark`, and `size_bytes` survive restart; `sessions_active` is ephemeral and resets on disconnect cleanup or broker restart.
      required:
        [realm, area, resource, offset, watermark, size_bytes, sessions_active, diagnostics]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        offset: { type: integer }
        watermark: { type: integer }
        size_bytes: { type: integer }
        sessions_active: { type: integer }
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    StreamRealmWatermarkDetail:
      type: object
      required: [realm, area_count, resource_count, family_watermarks]
      properties:
        realm:
          type: string
        area_count:
          type: integer
        resource_count:
          type: integer
        family_watermarks:
          type: array
          items:
            $ref: "#/components/schemas/StreamRealmWatermark"

    StreamRealmWatermark:
      type: object
      required: [family, watermark]
      properties:
        family:
          type: integer
          format: int64
        watermark:
          type: integer
          format: int64

    StreamAreaWatermarkDetail:
      type: object
      required: [realm, area, resource_count, family_watermarks]
      properties:
        realm:
          type: string
        area:
          type: string
        resource_count:
          type: integer
        family_watermarks:
          type: array
          items:
            $ref: "#/components/schemas/StreamAreaWatermark"

    StreamAreaWatermark:
      type: object
      required: [family, watermark]
      properties:
        family:
          type: integer
          format: int64
        watermark:
          type: integer
          format: int64

    LeaseResourceDetail:
      type: object
      description: Point-in-time live in-memory Lease state for a single resource on the current broker process. Counts reset on disconnect cleanup or broker restart and do not imply durable recovery.
      required: [realm, area, resource, active_leases, diagnostics]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        active_leases: { type: integer }
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    ScheduleResourceDetail:
      type: object
      description: Durable, boot-loaded schedule definition detail for the current broker. This describes persisted timing intent, not durable subscriber delivery or durable execution history. `executions_total` remains a non-authoritative placeholder until durable execution history exists.
      required: [realm, area, resource, enabled, executions_total, diagnostics]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        enabled: { type: boolean }
        cron:
          type: [string, "null"]
        next_run:
          type: [string, "null"]
        executions_total:
          type: integer
          description: Non-authoritative current broker counter. This is not durable execution history.
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    NoticeResourceDetail:
      type: object
      description: Live in-memory Notice detail for the current broker process. `subscriptions_active` is session-scoped fanout state only and disappears on disconnect cleanup or broker restart.
      required: [realm, area, resource, subscriptions_active, diagnostics]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        subscriptions_active:
          type: integer
          description: Broker-local count of active Notice subscriptions for this resource. Not durable and not replayable.
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    OperationEntry:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
    OperationCollection:
      type: object
      required: [realm, area, resource, operations]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationEntry"

    RpcOperationDetail:
      type: object
      description: Point-in-time live in-memory RPC state for a single operation on the current broker process. Worker registrations and pending requests are ephemeral, reset on disconnect cleanup or broker restart, and do not represent durable backlog or recovery state.
      required:
        [realm, area, resource, operation, workers_registered, requests_pending, diagnostics]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        operation: { type: string }
        workers_registered:
          type: integer
          description: Live in-memory workers currently registered for this exact operation on this broker process.
        requests_pending:
          type: integer
          description: Live in-memory pending requests waiting for a worker on this broker process. Not durable across disconnect or restart.
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    KvTransaction:
      type: object
      description: Session-scoped active KV transaction snapshot on the current broker process. Open transactions disappear on disconnect or broker restart and do not represent durable recovery state. Committed-data durability is handled separately by storage commit semantics.
      properties:
        tx_id: { type: integer }
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        mode: { type: string }
        started_at: { type: string }
        operations_count: { type: integer }
        idle_seconds: { type: integer }
    KvTransactionsList:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/KvTransaction"

    QueueInflight:
      type: object
      description: Live in-memory Queue inflight entry for the current broker process only. `inflight_token` and `session_id` belong to one active inflight entry and are dropped on disconnect cleanup, idle actor eviction, or broker restart.
      required:
        [
          message_id,
          family,
          realm,
          area,
          resource,
          inflight_token,
          session_id,
          expires_at,
          attempts,
        ]
      properties:
        message_id: { type: integer }
        family: { type: integer }
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        inflight_token: { type: string }
        session_id: { type: string }
        expires_at: { type: string }
        attempts: { type: integer }
    QueueInflightList:
      type: object
      required: [inflight]
      properties:
        inflight:
          type: array
          items:
            $ref: "#/components/schemas/QueueInflight"

    QueueDeadLettersList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/QueueDeadLetter"

    QueueDeadLetter:
      type: object
      description: Live in-memory Queue dead-letter snapshot for the current broker process. Dead-letter rows remain durably stored, but this endpoint only reflects rows for queue actors that are currently warm on this broker.
      required:
        [
          message_id,
          family,
          realm,
          area,
          resource,
          dead_lettered_at,
          attempts,
          reason,
        ]
      properties:
        message_id:
          type: integer
          format: int64
        family:
          type: integer
          format: int64
        realm:
          type: string
        area:
          type: string
        resource:
          type: string
        dead_lettered_at:
          type: string
        attempts:
          type: integer
        reason:
          type: string

    NoticeSubscription:
      type: object
      description: Live in-memory Notice subscription state for the current broker process. Subscriptions are session-scoped and are removed on disconnect or broker restart.
      properties:
        subscription_id:
          type: integer
          description: Broker-local identifier for the currently active in-memory subscription.
        session_id:
          type: string
          description: Owning live session identifier. The subscription disappears when this session disconnects.
        realm:
          type: string
          description: Realm extracted from the current subscription pattern.
        pattern:
          type: string
          description: Exact route or wildcard pattern tracked in memory for the active session.
        created_at:
          type: string
          description: Timestamp when this live in-memory subscription was created. Resets after reconnect or broker restart.
        notifications_received:
          type: integer
          description: Live counter of notifications delivered to this current in-memory subscription. Not durable and resets after reconnect or broker restart.
    NoticeSubscriptionsList:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/NoticeSubscription"

    RpcWorker:
      type: object
      description: Live in-memory RPC worker registration for the current broker process. Workers must re-register after disconnect or broker restart.
      properties:
        session_id:
          type: string
          description: Broker-local worker session identifier for the active registration.
        realm:
          type: string
          description: Realm extracted from the registered RPC route.
        route:
          type: string
          description: Exact RPC operation route currently handled by this live worker registration.
        registered_at:
          type: string
          description: Timestamp when this live worker registration was created. Resets after disconnect or broker restart.
        requests_handled:
          type: integer
          description: Number of terminal RPC requests completed by this live worker registration in the current broker process.
        average_latency_ms:
          type: number
          description: Average end-to-end latency for terminal RPC requests completed by this live worker registration in the current broker process.
    RpcWorkersList:
      type: object
      required: [workers]
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/RpcWorker"

    RpcPendingRequest:
      type: object
      description: Live in-memory pending RPC request tracked by the current broker process only. Pending requests disappear on timeout, cleanup, or broker restart.
      properties:
        correlation_id:
          type: string
          description: Correlation identifier for the live in-memory request.
        route:
          type: string
          description: Exact RPC operation route for the currently pending request.
        submitted_at:
          type: string
          description: Timestamp when the current broker process accepted and tracked the request in memory.
        age_seconds:
          type: integer
          description: Approximate wall-clock age of the current in-memory pending request.
        worker_session_id:
          type: [string, "null"]
          description: Broker-local worker session currently assigned to the pending request when one is known.
    RpcPendingList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/RpcPendingRequest"

    SessionInfo:
      type: object
      properties:
        session_id: { type: string }
        realm: { type: string }
        connected_at: { type: string }
        idle_seconds: { type: integer }
        messages_received: { type: integer }
        messages_sent: { type: integer }
        transport: { type: string }
        remote_addr: { type: string }
    SessionsList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: Authentication required or session invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
