openapi: 3.1.0
info:
  title: Fitz Admin API
  version: 2.0.0
  description: |
    REST API for the Fitz admin UI.

    The admin API uses cookie-backed session authentication. Most `/api/v1/**`
    endpoints require a valid admin session cookie issued by `POST /api/v1/session`.

    Fitz admin surfaces intentionally mix durable committed state and live broker-local
    state. Schema descriptions call out which fields survive restart and which fields
    are current-process or session-scoped only.

servers:
  - url: http://localhost:4090
    description: Local development server

tags:
  - name: Auth
  - name: Health
  - name: Metrics
  - name: Sessions
  - name: KV
  - name: Queue
  - name: Stream
  - name: Lease
  - name: Schedule
  - name: Notice
  - name: RPC

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getLivenessProbe
      security: []
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: getReadinessProbe
      security: []
      responses:
        "200":
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"

  /startupz:
    get:
      tags: [Health]
      summary: Startup probe
      operationId: getStartupProbe
      security: []
      responses:
        "200":
          description: Startup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupStatus"
        "503":
          description: Startup in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupStatus"

  /health:
    get:
      tags: [Health]
      summary: Legacy health endpoint
      operationId: getLegacyHealth
      security: []
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      operationId: getMetrics
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/session:
    post:
      tags: [Auth]
      summary: Create admin session
      operationId: createAdminSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Session created and cookie set
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Auth]
      summary: Get current admin session
      operationId: getAdminSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Auth]
      summary: Delete admin session
      operationId: deleteAdminSession
      security: []
      responses:
        "204":
          description: Session cleared and cookie removed

  /api/v1/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      operationId: listActiveSessions
      security:
        - sessionCookie: []
      parameters:
        - name: realm
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stats:
    get:
      tags: [Stats]
      summary: Get global broker and domain statistics
      operationId: getGlobalStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Global broker and domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/kv/stats:
    get:
      tags: [Stats, KV]
      summary: Get KV domain statistics
      operationId: getKvStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: KV domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stream/stats:
    get:
      tags: [Stats, Stream]
      summary: Get Stream domain statistics
      operationId: getStreamStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Stream domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notice/stats:
    get:
      tags: [Stats, Notice]
      summary: Get Notice domain statistics
      operationId: getNoticeStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Notice domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/queue/stats:
    get:
      tags: [Stats, Queue]
      summary: Get Queue domain statistics
      operationId: getQueueStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Queue domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/rpc/stats:
    get:
      tags: [Stats, RPC]
      summary: Get RPC domain statistics
      operationId: getRpcStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: RPC domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/lease/stats:
    get:
      tags: [Stats, Lease]
      summary: Get Lease domain statistics
      operationId: getLeaseStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Lease domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/schedule/stats:
    get:
      tags: [Stats, Schedule]
      summary: Get Schedule domain statistics
      operationId: getScheduleStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Schedule domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/kv/realms:
    get:
      tags: [KV]
      summary: List KV realms
      operationId: listKvRealms
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: KV realms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmCollection"
  /api/v1/kv/realms/{realm}:
    get:
      tags: [KV]
      summary: Get KV realm
      operationId: getKvRealm
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KV realm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmDetail"
  /api/v1/kv/realms/{realm}/areas:
    get:
      tags: [KV]
      summary: List KV areas in a realm
      operationId: listKvAreas
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KV areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaCollection"
  /api/v1/kv/realms/{realm}/areas/{area}:
    get:
      tags: [KV]
      summary: Get KV area
      operationId: getKvArea
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KV area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaDetail"
  /api/v1/kv/realms/{realm}/areas/{area}/resources:
    get:
      tags: [KV]
      summary: List KV resources in an area
      operationId: listKvResources
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KV resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollection"
  /api/v1/kv/realms/{realm}/areas/{area}/resources/{resource}:
    get:
      tags: [KV]
      summary: Get KV resource
      operationId: getKvResource
      description: Live broker-local KV resource detail. `transactions_active` counts only the current in-memory session-scoped transactions for this resource and resets on disconnect cleanup or broker restart.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KV resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvResourceDetail"
  /api/v1/kv/realms/{realm}/areas/{area}/resources/{resource}/transactions:
    get:
      tags: [KV]
      summary: List KV transactions for a resource
      operationId: listKvTransactions
      description: Live in-memory KV transaction snapshots for the current broker process. Transactions are session-scoped, disappear on disconnect or broker restart, and do not represent a durable recovery log.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KV transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvTransactionsList"

  /api/v1/queue/realms:
    get:
      tags: [Queue]
      summary: List queue realms
      operationId: listQueueRealms
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Queue realms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmCollection"
  /api/v1/queue/realms/{realm}:
    get:
      tags: [Queue]
      summary: Get queue realm
      operationId: getQueueRealm
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue realm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmDetail"
  /api/v1/queue/realms/{realm}/areas:
    get:
      tags: [Queue]
      summary: List queue areas
      operationId: listQueueAreas
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaCollection"
  /api/v1/queue/realms/{realm}/areas/{area}:
    get:
      tags: [Queue]
      summary: Get queue area
      operationId: getQueueArea
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaDetail"
  /api/v1/queue/realms/{realm}/areas/{area}/resources:
    get:
      tags: [Queue]
      summary: List queues in an area
      operationId: listQueueResources
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollection"
  /api/v1/queue/realms/{realm}/areas/{area}/resources/{resource}:
    get:
      tags: [Queue]
      summary: Get queue resource
      operationId: getQueueResource
      description: Point-in-time warm-actor Queue detail for the current broker process. Counts are refreshed from live in-memory queue actors only and can disappear after idle eviction or broker restart until traffic rehydrates that queue.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResourceDetail"
  /api/v1/queue/realms/{realm}/areas/{area}/resources/{resource}/inflight:
    get:
      tags: [Queue]
      summary: List queue inflight entries for a resource
      operationId: listQueueInflightEntries
      description: Live in-memory queue inflight entries for the current broker process only. Inflight ownership, tokens, and session IDs disappear on disconnect cleanup, idle actor eviction, or broker restart.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue inflight entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueInflightList"

  /api/v1/queue/realms/{realm}/areas/{area}/resources/{resource}/dead-letters:
    get:
      tags: [Queue]
      summary: List queue dead-letter entries for a resource
      operationId: listQueueDeadLetters
      description: Live in-memory dead-letter rows for the current broker process. Rows remain durably stored, but this view only reflects queue actors currently warm on this broker.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: family
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Queue dead-letter entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDeadLettersList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/queue/realms/{realm}/areas/{area}/resources/{resource}/dead-letters/{message_id}/replay:
    post:
      tags: [Queue]
      summary: Replay a queue dead-letter entry
      operationId: replayQueueDeadLetter
      description: Replays a retained dead-letter row using the current broker-local queue family.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: message_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: family
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Dead-letter replay accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Dead-letter row not found
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/queue/realms/{realm}/areas/{area}/resources/{resource}/dead-letters/{message_id}:
    delete:
      tags: [Queue]
      summary: Purge a queue dead-letter entry
      operationId: purgeQueueDeadLetter
      description: Deletes a retained dead-letter row using the current broker-local queue family.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: message_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: family
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Dead-letter row purged
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Dead-letter row not found
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stream/realms:
    get:
      tags: [Stream]
      summary: List stream realms
      operationId: listStreamRealms
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Stream realms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmCollection"
  /api/v1/stream/realms/{realm}:
    get:
      tags: [Stream]
      summary: Get stream realm
      operationId: getStreamRealm
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream realm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmDetail"
  /api/v1/stream/realms/{realm}/areas:
    get:
      tags: [Stream]
      summary: List stream areas
      operationId: listStreamAreas
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaCollection"
  /api/v1/stream/realms/{realm}/areas/{area}:
    get:
      tags: [Stream]
      summary: Get stream area
      operationId: getStreamArea
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaDetail"
  /api/v1/stream/realms/{realm}/areas/{area}/resources:
    get:
      tags: [Stream]
      summary: List streams in an area
      operationId: listStreamResources
      description: Lists committed stream resources known from durable stream metadata for the selected area. Resources remain visible after broker restart even when no append session is currently active.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Streams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollection"
  /api/v1/stream/realms/{realm}/areas/{area}/resources/{resource}:
    get:
      tags: [Stream]
      summary: Get stream resource
      operationId: getStreamResource
      description: Returns durable committed stream metadata for this resource plus the current broker process's live append-session count. `sessions_active` resets on disconnect cleanup or broker restart; consumer cursors are client-managed and not stored here.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResourceDetail"

  /api/v1/stream/realms/{realm}/watermarks:
    get:
      tags: [Stream]
      summary: Get stream realm watermarks
      operationId: getStreamRealmWatermarks
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream realm watermark detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamRealmWatermarkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stream/realms/{realm}/areas/{area}/watermarks:
    get:
      tags: [Stream]
      summary: Get stream area watermarks
      operationId: getStreamAreaWatermarks
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream area watermark detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamAreaWatermarkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/lease/realms:
    get:
      tags: [Lease]
      summary: List lease realms
      operationId: listLeaseRealms
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Lease realms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmCollection"
  /api/v1/lease/realms/{realm}:
    get:
      tags: [Lease]
      summary: Get lease realm
      operationId: getLeaseRealm
      security: [{ sessionCookie: [] }]
      parameters:
        - name: realm
