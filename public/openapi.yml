openapi: 3.1.0
info:
  title: Fitz Admin API
  version: 1.0.0
  description: |
    REST API for observability, health checks, and operational control of the Fitz message broker.

    ## Features
    - Kubernetes health probes (liveness, readiness, startup)
    - Prometheus metrics export
    - Real-time broker statistics
    - Per-domain statistics (KV, Stream, Notice, Queue, RPC, Lease, Schedule)

    ## Authentication
    Most endpoints require Bearer token authentication:
    ```
    Authorization: Bearer <your-token>
    ```

    Health probes (`/healthz`, `/readyz`, `/startupz`) are public for load balancer access.
  contact:
    name: Fitz Team
    url: https://github.com/cntryl/fitz
  license:
    name: MIT
    url: https://github.com/cntryl/fitz/blob/main/LICENSE

servers:
  - url: http://localhost:4090
    description: Local development server
  - url: https://fitz.example.com
    description: Production server

tags:
  - name: Health Probes
    description: Kubernetes liveness, readiness, and startup probes
  - name: Metrics
    description: Prometheus metrics endpoint
  - name: Statistics
    description: Broker and domain statistics

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags:
        - Health Probes
      summary: Liveness probe
      description: |
        Kubernetes liveness probe. Returns 200 OK if the application is alive.
        Returns 503 only if deadlocked or panicked.
      operationId: getLiveness
      security: [] # Public endpoint
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "503":
          description: Application is deadlocked or unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: unhealthy

  /readyz:
    get:
      tags:
        - Health Probes
      summary: Readiness probe
      description: |
        Kubernetes readiness probe. Returns 200 OK if ready to accept traffic.
        Checks storage and domain initialization status.
      operationId: getReadiness
      security: [] # Public endpoint
      responses:
        "200":
          description: Application is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
              example:
                status: ready
                checks:
                  storage: ok
                  domains_initialized: ok
        "503":
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
              example:
                status: not_ready
                checks:
                  storage: ok
                  domains_initialized: not_ready

  /startupz:
    get:
      tags:
        - Health Probes
      summary: Startup probe
      description: |
        Kubernetes startup probe. Returns 200 OK when startup is complete.
        Prevents premature liveness checks during slow startup.
      operationId: getStartup
      security: [] # Public endpoint
      responses:
        "200":
          description: Startup is complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupStatus"
              example:
                status: started
                startup_time_seconds: 2.5
        "503":
          description: Startup is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupStatus"
              example:
                status: starting
                startup_time_seconds: 1.2

  /health:
    get:
      tags:
        - Health Probes
      summary: Legacy health check
      description: Legacy health endpoint. Equivalent to /healthz.
      operationId: getHealth
      security: [] # Public endpoint
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok

  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics
      description: |
        Prometheus-compatible metrics endpoint.
        Returns metrics in Prometheus text format.

        **Requires authentication.**
      operationId: getMetrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus metrics in text format
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
              example: |
                # HELP fitz_uptime_seconds Broker uptime in seconds
                # TYPE fitz_uptime_seconds gauge
                fitz_uptime_seconds 3600

                # HELP fitz_connections_total Total number of active connections
                # TYPE fitz_connections_total gauge
                fitz_connections_total 42

                # HELP fitz_sessions_total Total number of active sessions
                # TYPE fitz_sessions_total gauge
                fitz_sessions_total 38

                # HELP fitz_messages_received_total Total messages received
                # TYPE fitz_messages_received_total counter
                fitz_messages_received_total 15234

                # HELP fitz_messages_sent_total Total messages sent
                # TYPE fitz_messages_sent_total counter
                fitz_messages_sent_total 15198
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/stats:
    get:
      tags:
        - Statistics
      summary: Global broker statistics
      description: |
        Returns comprehensive statistics for the entire broker,
        including broker-level metrics and all domain statistics.

        **Requires authentication with admin scope.**
      operationId: getGlobalStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Global broker statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/kv/stats:
    get:
      tags:
        - Statistics
      summary: KV domain statistics
      description: |
        Returns statistics specific to the Key-Value (KV) domain.

        **Requires authentication with admin scope.**
      operationId: getKvStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KV domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvStats"
              example:
                transactions_active: 5
                keys_total: 1234
                operations_per_second: 45.2
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/stream/stats:
    get:
      tags:
        - Statistics
      summary: Stream domain statistics
      description: |
        Returns statistics specific to the Stream domain.

        **Requires authentication with admin scope.**
      operationId: getStreamStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stream domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamStats"
              example:
                streams_active: 12
                events_total: 98765
                operations_per_second: 123.4
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/notice/stats:
    get:
      tags:
        - Statistics
      summary: Notice domain statistics
      description: |
        Returns statistics specific to the Notice (pub/sub) domain.

        **Requires authentication with admin scope.**
      operationId: getNoticeStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notice domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeStats"
              example:
                subscriptions_active: 28
                publishes_per_second: 67.8
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/queue/stats:
    get:
      tags:
        - Statistics
      summary: Queue domain statistics
      description: |
        Returns statistics specific to the Queue domain.

        **Requires authentication with admin scope.**
      operationId: getQueueStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"
              example:
                messages_pending: 156
                leases_active: 8
                operations_per_second: 34.2
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/rpc/stats:
    get:
      tags:
        - Statistics
      summary: RPC domain statistics
      description: |
        Returns statistics specific to the RPC domain.

        **Requires authentication with admin scope.**
      operationId: getRpcStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: RPC domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcStats"
              example:
                workers_registered: 4
                requests_pending: 12
                operations_per_second: 89.3
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/lease/stats:
    get:
      tags:
        - Statistics
      summary: Lease domain statistics
      description: |
        Returns statistics specific to the Lease domain.

        **Requires authentication with admin scope.**
      operationId: getLeaseStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lease domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseStats"
              example:
                leases_active: 6
                operations_per_second: 2.1
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/schedule/stats:
    get:
      tags:
        - Statistics
      summary: Schedule domain statistics
      description: |
        Returns statistics specific to the Schedule domain.

        **Requires authentication with admin scope.**
      operationId: getScheduleStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Schedule domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStats"
              example:
                schedules_active: 3
                executions_per_minute: 5.2
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token for authentication.

        Example:
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```

  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
          description: Health status of the application
          example: ok

    ReadyStatus:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          description: Overall readiness status
          example: ready
        checks:
          $ref: "#/components/schemas/CheckResults"

    CheckResults:
      type: object
      required:
        - storage
        - domains_initialized
      properties:
        storage:
          type: string
          enum: [ok, not_ready]
          description: Storage initialization status
          example: ok
        domains_initialized:
          type: string
          enum: [ok, not_ready]
          description: Domain actor initialization status
          example: ok

    StartupStatus:
      type: object
      required:
        - status
        - startup_time_seconds
      properties:
        status:
          type: string
          enum: [started, starting]
          description: Startup completion status
          example: started
        startup_time_seconds:
          type: number
          format: double
          description: Time elapsed since startup began (in seconds)
          example: 2.5

    GlobalStats:
      type: object
      required:
        - broker
        - domains
      properties:
        broker:
          $ref: "#/components/schemas/BrokerStats"
        domains:
          $ref: "#/components/schemas/DomainStats"

    BrokerStats:
      type: object
      required:
        - uptime_seconds
        - connections
        - sessions
        - realms
        - messages_per_second
      properties:
        uptime_seconds:
          type: integer
          format: uint64
          description: Broker uptime in seconds
          example: 3600
        connections:
          type: integer
          description: Number of active connections
          example: 42
        sessions:
          type: integer
          description: Number of active sessions
          example: 38
        realms:
          type: array
          items:
            type: string
          description: List of active realm identifiers
          example: ["acme", "tenant-123", "prod"]
        messages_per_second:
          type: number
          format: double
          description: Average messages per second (sent + received)
          example: 123.45

    DomainStats:
      type: object
      required:
        - kv
        - stream
        - notice
        - queue
        - rpc
        - lease
        - schedule
      properties:
        kv:
          $ref: "#/components/schemas/KvStats"
        stream:
          $ref: "#/components/schemas/StreamStats"
        notice:
          $ref: "#/components/schemas/NoticeStats"
        queue:
          $ref: "#/components/schemas/QueueStats"
        rpc:
          $ref: "#/components/schemas/RpcStats"
        lease:
          $ref: "#/components/schemas/LeaseStats"
        schedule:
          $ref: "#/components/schemas/ScheduleStats"

    KvStats:
      type: object
      required:
        - transactions_active
        - keys_total
        - operations_per_second
      properties:
        transactions_active:
          type: integer
          description: Number of active KV transactions
          example: 5
        keys_total:
          type: integer
          description: Total number of keys in storage
          example: 1234
        operations_per_second:
          type: number
          format: double
          description: KV operations per second
          example: 45.2

    StreamStats:
      type: object
      required:
        - streams_active
        - events_total
        - operations_per_second
      properties:
        streams_active:
          type: integer
          description: Number of active streams
          example: 12
        events_total:
          type: integer
          description: Total number of events across all streams
          example: 98765
        operations_per_second:
          type: number
          format: double
          description: Stream operations per second
          example: 123.4

    NoticeStats:
      type: object
      required:
        - subscriptions_active
        - publishes_per_second
      properties:
        subscriptions_active:
          type: integer
          description: Number of active subscriptions
          example: 28
        publishes_per_second:
          type: number
          format: double
          description: Publish operations per second
          example: 67.8

    QueueStats:
      type: object
      required:
        - messages_pending
        - leases_active
        - operations_per_second
      properties:
        messages_pending:
          type: integer
          description: Number of messages pending in queues
          example: 156
        leases_active:
          type: integer
          description: Number of active queue message leases
          example: 8
        operations_per_second:
          type: number
          format: double
          description: Queue operations per second
          example: 34.2

    RpcStats:
      type: object
      required:
        - workers_registered
        - requests_pending
        - operations_per_second
      properties:
        workers_registered:
          type: integer
          description: Number of registered RPC workers
          example: 4
        requests_pending:
          type: integer
          description: Number of pending RPC requests
          example: 12
        operations_per_second:
          type: number
          format: double
          description: RPC operations per second
          example: 89.3

    LeaseStats:
      type: object
      required:
        - leases_active
        - operations_per_second
      properties:
        leases_active:
          type: integer
          description: Number of active leases
          example: 6
        operations_per_second:
          type: number
          format: double
          description: Lease operations per second
          example: 2.1

    ScheduleStats:
      type: object
      required:
        - schedules_active
        - executions_per_minute
      properties:
        schedules_active:
          type: integer
          description: Number of active schedules
          example: 3
        executions_per_minute:
          type: number
          format: double
          description: Schedule executions per minute
          example: 5.2

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: Unauthorized

  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Unauthorized
