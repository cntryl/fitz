openapi: 3.1.0
info:
  title: Fitz Admin API
  version: 3.0.0
  description: |
    REST API for the Fitz admin UI.

    The admin API uses cookie-backed session authentication. Most `/api/v1/**`
    endpoints require a valid admin session cookie issued by `POST /api/v1/session`.

    Fitz admin surfaces intentionally mix durable committed state and live broker-local
    state. Schema descriptions call out which fields survive restart and which fields
    are current-process or session-scoped only.

servers:
  - url: /
    description: Same-origin admin API server

tags:
  - name: Auth
  - name: Runtime
  - name: Metrics
  - name: Sessions
  - name: Stats
  - name: Topology
  - name: Search
  - name: KV
  - name: Queue
  - name: Stream
  - name: Lease
  - name: Schedule
  - name: Notice
  - name: RPC
  - name: Troubleshooting

paths:
  /api/v1/{family}/metrics:
    get:
      tags: [Metrics]
      summary: Get metrics for one route family
      operationId: getFamilyMetrics
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      responses:
        "200":
          description: Structured metrics attributable to the requested route family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredMetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/all/metrics:
    get:
      tags: [Metrics]
      summary: Get broker-wide metrics
      operationId: getAllMetrics
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Structured broker-wide metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredMetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/session:
    post:
      tags: [Auth]
      summary: Create admin session
      operationId: createAdminSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Session created and cookie set
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Auth]
      summary: Get current admin session
      operationId: getAdminSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Auth]
      summary: Delete admin session
      operationId: deleteAdminSession
      security: []
      responses:
        "204":
          description: Session cleared and cookie removed

  /api/v1/features:
    get:
      tags: [Auth]
      summary: Get admin UI feature flags and unauthenticated bootstrap metadata
      operationId: getAdminFeatures
      security: []
      responses:
        "200":
          description: Admin UI features
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeaturesResponse"

  /api/v1/runtime/drain:
    post:
      tags: [Runtime]
      summary: Begin planned broker drain
      description: Marks this broker as draining so readiness probes fail, new TCP/WebSocket sessions are rejected, and a later SIGTERM can close existing ephemeral sessions after the configured drain grace period.
      operationId: beginRuntimeDrain
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Drain state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeDrainResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      operationId: listActiveSessions
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions for one route family
      operationId: listFamilySessions
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      responses:
        "200":
          description: Active sessions for the requested route family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stats:
    get:
      tags: [Stats]
      summary: Get global broker and domain statistics
      operationId: getGlobalStats
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Global broker and domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/stats:
    get:
      tags: [Stats]
      summary: Get route-family broker and domain statistics
      operationId: getFamilyStats
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      responses:
        "200":
          description: Broker and domain statistics for the requested route family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/topology:
    get:
      tags: [Topology]
      summary: Get current messaging topology
      description: Returns a bounded, read-only snapshot of current broker-visible messaging flow, sessions, domain lanes, and bottleneck signals. This endpoint is observability only and does not imply durable tracing or recovery of session-scoped state.
      operationId: getMessagingTopology
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current messaging topology snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingTopology"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/topology:
    get:
      tags: [Topology]
      summary: Get route-family messaging topology
      operationId: getFamilyTopology
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      responses:
        "200":
          description: Messaging topology attributable to the requested route family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingTopology"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/troubleshooting:
    get:
      tags: [Troubleshooting]
      summary: Get global troubleshooting guidance
      operationId: getGlobalTroubleshootingGuidance
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Global troubleshooting guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalTroubleshootingDiagnostics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/troubleshooting:
    get:
      tags: [Troubleshooting]
      summary: Get route-family troubleshooting guidance
      operationId: getFamilyTroubleshootingGuidance
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      responses:
        "200":
          description: Troubleshooting guidance for the requested route family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalTroubleshootingDiagnostics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/search:
    get:
      tags: [Search]
      summary: Search admin-visible broker state
      description: Returns read-only, domain-aware search results built from existing admin snapshots. Results may mix durable committed state and live broker-local state; each result kind follows the durability semantics of its source endpoint.
      operationId: searchAdminState
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: route_family
          in: query
          required: false
          schema:
            type: string
        - name: domain
          in: query
          required: false
          schema:
            type: string
            enum: [sessions, kv, stream, queue, schedule, lease, notice, rpc]
        - name: realm
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: resource
          in: query
          required: false
          schema:
            type: string
        - name: operation
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 50
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/kv/stats:
    get:
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      tags: [Stats, KV]
      summary: Get KV domain statistics
      operationId: getKvStats
      security:
        - sessionCookie: []
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: KV domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/stream/stats:
    get:
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      tags: [Stats, Stream]
      summary: Get Stream domain statistics
      operationId: getStreamStats
      security:
        - sessionCookie: []
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Stream domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/notice/stats:
    get:
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      tags: [Stats, Notice]
      summary: Get Notice domain statistics
      operationId: getNoticeStats
      security:
        - sessionCookie: []
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Notice domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/queue/stats:
    get:
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      tags: [Stats, Queue]
      summary: Get Queue domain statistics
      operationId: getQueueStats
      security:
        - sessionCookie: []
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Queue domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/rpc/stats:
    get:
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      tags: [Stats, RPC]
      summary: Get RPC domain statistics
      operationId: getRpcStats
      security:
        - sessionCookie: []
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: RPC domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/lease/stats:
    get:
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      tags: [Stats, Lease]
      summary: Get Lease domain statistics
      operationId: getLeaseStats
      security:
        - sessionCookie: []
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Lease domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/schedule/stats:
    get:
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      tags: [Stats, Schedule]
      summary: Get Schedule domain statistics
      operationId: getScheduleStats
      security:
        - sessionCookie: []
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Schedule domain statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/{family}/kv/realms:
    get:
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
      tags: [KV]
      summary: List KV realms
      operationId: listKvRealms
      security: [{ sessionCookie: [] }]
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: KV realms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmCollection"
  /api/v1/{family}/kv/realms/{realm}:
    get:
      tags: [KV]
      summary: Get KV realm
      operationId: getKvRealm
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: KV realm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealmDetail"
  /api/v1/{family}/kv/realms/{realm}/areas:
    get:
      tags: [KV]
      summary: List KV areas in a realm
      operationId: listKvAreas
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: KV areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaCollection"
  /api/v1/{family}/kv/realms/{realm}/areas/{area}:
    get:
      tags: [KV]
      summary: Get KV area
      operationId: getKvArea
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: KV area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaDetail"
  /api/v1/{family}/kv/realms/{realm}/areas/{area}/resources:
    get:
      tags: [KV]
      summary: List KV resources in an area
      operationId: listKvResources
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: KV resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCollection"
  /api/v1/{family}/kv/realms/{realm}/areas/{area}/resources/{resource}:
    get:
      tags: [KV]
      summary: Get KV resource
      operationId: getKvResource
      description: Live broker-local KV resource detail. `transactions_active` counts only the current in-memory session-scoped transactions for this resource and resets on disconnect cleanup or broker restart.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: KV resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvResourceDetail"
  /api/v1/{family}/kv/realms/{realm}/areas/{area}/resources/{resource}/value:
    get:
      tags: [KV]
      summary: Get committed KV value
      operationId: getKvCommittedValue
      description: Admin-only exact-key read of durable committed KV state for one explicit Route Family, realm, area, and resource. This does not expose uncommitted session transactions or historical versions.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: key_encoding
          in: query
          required: false
          schema:
            type: string
            enum: [utf8, base64]
            default: utf8
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Committed KV value lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvCommittedValueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/{family}/kv/realms/{realm}/areas/{area}/resources/{resource}/prefix:
    get:
      tags: [KV]
      summary: Scan committed KV prefix
      operationId: scanKvCommittedPrefix
      description: Admin-only prefix scan of durable committed KV state for one explicit Route Family, realm, area, and resource. Results are current committed key/value pairs, not a replay log or version history.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: prefix
          in: query
          required: true
          schema:
            type: string
        - name: key_encoding
          in: query
          required: false
          schema:
            type: string
            enum: [utf8, base64]
            default: utf8
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 50
            minimum: 1
            maximum: 100
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Committed KV prefix scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvPrefixScanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/{family}/kv/realms/{realm}/areas/{area}/resources/{resource}/rows:
    get:
      tags: [KV]
      summary: Browse committed KV rows
      operationId: browseKvCommittedRows
      description: Admin-only cursor page of durable committed KV rows for one explicit Route Family, realm, area, and resource. Results are current committed key/value pairs, not a replay log or version history. The `cursor` parameter is the opaque base64 `next_cursor` from the previous response.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - name: starts_with
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: key_encoding
          in: query
          required: false
          schema:
            type: string
            enum: [utf8, base64]
            default: utf8
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 50
            minimum: 1
            maximum: 100
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Committed KV row page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KvRowsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/{family}/kv/realms/{realm}/areas/{area}/resources/{resource}/transactions:
    get:
      tags: [KV]
      summary: List KV transactions for a resource
      operationId: listKvTransactions
      description: Live in-memory KV transaction snapshots for the current broker process. Transactions are session-scoped, disappear on disconnect or broker restart, and do not represent a durable recovery log.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FamilyPath"
        - name: realm
          in: path
          required: true
          schema:
