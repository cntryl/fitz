      in: cookie
      name: fitz_admin_session
      description: Admin session JWT cookie issued by `POST /api/v1/session`.

  parameters:
    RealmPath:
      name: realm
      in: path
      required: true
      schema:
        type: string
    AreaPath:
      name: area
      in: path
      required: true
      schema:
        type: string
    ResourcePath:
      name: resource
      in: path
      required: true
      schema:
        type: string
    OperationPath:
      name: operation
      in: path
      required: true
      schema:
        type: string
    RealmQuery:
      name: realm
      in: query
      required: false
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ReadyStatus:
      type: object
      properties:
        status:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
      required: [status, checks]

    StartupStatus:
      type: object
      properties:
        status:
          type: string
        startup_time_seconds:
          type: number
      required: [status, startup_time_seconds]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    SessionState:
      type: object
      required: [authenticated, username]
      properties:
        authenticated:
          type: boolean
        username:
          type: string

    RealmEntry:
      type: object
      required: [realm]
      properties:
        realm:
          type: string
    RealmCollection:
      type: object
      required: [realms]
      properties:
        realms:
          type: array
          items:
            $ref: "#/components/schemas/RealmEntry"
    RealmDetail:
      type: object
      required: [realm]
      properties:
        realm:
          type: string

    AreaEntry:
      type: object
      required: [area]
      properties:
        area:
          type: string
    AreaCollection:
      type: object
      required: [realm, areas]
      properties:
        realm:
          type: string
        areas:
          type: array
          items:
            $ref: "#/components/schemas/AreaEntry"
    AreaDetail:
      type: object
      required: [realm, area]
      properties:
        realm:
          type: string
        area:
          type: string

    ResourceEntry:
      type: object
      required: [resource]
      properties:
        resource:
          type: string
    ResourceCollection:
      type: object
      required: [realm, area, resources]
      properties:
        realm:
          type: string
        area:
          type: string
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceEntry"

    KvResourceDetail:
      type: object
      required: [realm, area, resource, transactions_active]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        transactions_active: { type: integer }

    QueueResourceDetail:
      type: object
      required:
        [realm, area, resource, messages_ready, messages_leased, messages_total, oldest_message_age_seconds]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        messages_ready: { type: integer }
        messages_leased: { type: integer }
        messages_total: { type: integer }
        oldest_message_age_seconds: { type: integer }

    StreamResourceDetail:
      type: object
      required: [realm, area, resource, offset, watermark, size_bytes, sessions_active]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        offset: { type: integer }
        watermark: { type: integer }
        size_bytes: { type: integer }
        sessions_active: { type: integer }

    LeaseResourceDetail:
      type: object
      required: [realm, area, resource, active_leases]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        active_leases: { type: integer }

    ScheduleResourceDetail:
      type: object
      required: [realm, area, resource, enabled, executions_total]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        enabled: { type: boolean }
        cron:
          type: [string, "null"]
        next_run:
          type: [string, "null"]
        executions_total: { type: integer }

    NoticeResourceDetail:
      type: object
      required: [realm, area, resource, subscriptions_active]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        subscriptions_active: { type: integer }

    OperationEntry:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
    OperationCollection:
      type: object
      required: [realm, area, resource, operations]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationEntry"

    RpcOperationDetail:
      type: object
      required: [realm, area, resource, operation, workers_registered, requests_pending]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        operation: { type: string }
        workers_registered: { type: integer }
        requests_pending: { type: integer }

    KvTransaction:
      type: object
      properties:
        tx_id: { type: integer }
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        mode: { type: string }
        started_at: { type: string }
        operations_count: { type: integer }
        idle_seconds: { type: integer }
    KvTransactionsList:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/KvTransaction"

    QueueLease:
      type: object
      properties:
        message_id: { type: integer }
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        lease_token: { type: string }
        session_id: { type: string }
        expires_at: { type: string }
        attempts: { type: integer }
    QueueLeasesList:
      type: object
      required: [leases]
      properties:
        leases:
          type: array
          items:
            $ref: "#/components/schemas/QueueLease"

    NoticeSubscription:
      type: object
      description: Live in-memory Notice subscription state for the current broker process. Subscriptions are session-scoped and are removed on disconnect or broker restart.
      properties:
        subscription_id:
          type: integer
          description: Broker-local identifier for the currently active in-memory subscription.
        session_id:
          type: string
          description: Owning live session identifier. The subscription disappears when this session disconnects.
        realm:
          type: string
          description: Realm extracted from the current subscription pattern.
        pattern:
          type: string
          description: Exact route or wildcard pattern tracked in memory for the active session.
        created_at:
          type: string
          description: Timestamp when this live in-memory subscription was created. Resets after reconnect or broker restart.
        notifications_received:
          type: integer
          description: Live counter of notifications delivered to this current in-memory subscription. Not durable and resets after reconnect or broker restart.
    NoticeSubscriptionsList:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/NoticeSubscription"

    RpcWorker:
      type: object
      properties:
        session_id: { type: string }
        realm: { type: string }
        route: { type: string }
        registered_at: { type: string }
        requests_handled: { type: integer }
        average_latency_ms: { type: number }
    RpcWorkersList:
      type: object
      required: [workers]
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/RpcWorker"

    RpcPendingRequest:
      type: object
      properties:
        correlation_id: { type: string }
        route: { type: string }
        submitted_at: { type: string }
        age_seconds: { type: integer }
        worker_session_id:
          type: [string, "null"]
    RpcPendingList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/RpcPendingRequest"

    SessionInfo:
      type: object
      properties:
        session_id: { type: string }
        realm: { type: string }
        connected_at: { type: string }
        idle_seconds: { type: integer }
        messages_received: { type: integer }
        messages_sent: { type: integer }
        transport: { type: string }
        remote_addr: { type: string }
    SessionsList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: Authentication required or session invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
