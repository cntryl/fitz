        enabled: { type: boolean }
        cron:
          type: [string, "null"]
        next_run:
          type: [string, "null"]
        executions_total:
          type: integer
          description: Non-authoritative current broker counter. This is not durable execution history.
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    NoticeResourceDetail:
      type: object
      description: Live in-memory Notice detail for the current broker process. `subscriptions_active` is session-scoped fanout state only and disappears on disconnect cleanup or broker restart.
      required: [realm, area, resource, subscriptions_active, diagnostics]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        subscriptions_active:
          type: integer
          description: Broker-local count of active Notice subscriptions for this resource. Not durable and not replayable.
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    OperationEntry:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
    OperationCollection:
      type: object
      required: [realm, area, resource, operations]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationEntry"

    RpcOperationDetail:
      type: object
      description: Point-in-time live in-memory RPC state for a single operation on the current broker process. Worker registrations and pending requests are ephemeral, reset on disconnect cleanup or broker restart, and do not represent durable backlog or recovery state.
      required:
        [
          realm,
          area,
          resource,
          operation,
          workers_registered,
          requests_pending,
          slowest_worker_average_latency_ms,
          worker_latency_buckets,
          diagnostics,
        ]
      properties:
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        operation: { type: string }
        workers_registered:
          type: integer
          description: Live in-memory workers currently registered for this exact operation on this broker process.
        requests_pending:
          type: integer
          description: Live in-memory pending requests waiting for a worker on this broker process. Not durable across disconnect or restart.
        slowest_worker_average_latency_ms:
          type: number
          description: Slowest average latency observed among live workers for this exact RPC operation on the current broker process.
        worker_latency_buckets:
          $ref: "#/components/schemas/RpcLatencyBuckets"
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"

    KvTransaction:
      type: object
      description: Session-scoped active KV transaction snapshot on the current broker process. Open transactions disappear on disconnect or broker restart and do not represent durable recovery state. Committed-data durability is handled separately by storage commit semantics.
      properties:
        tx_id: { type: integer }
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        mode: { type: string }
        started_at: { type: string }
        operations_count: { type: integer }
        idle_seconds: { type: integer }
    KvTransactionsList:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/KvTransaction"

    QueueInflight:
      type: object
      description: Live in-memory Queue inflight entry for the current broker process only. `inflight_token` and `session_id` belong to one active inflight entry and are dropped on disconnect cleanup, idle actor eviction, or broker restart.
      required:
        [
          message_id,
          family,
          realm,
          area,
          resource,
          inflight_token,
          session_id,
          expires_at,
          attempts,
        ]
      properties:
        message_id: { type: integer }
        family: { type: integer }
        realm: { type: string }
        area: { type: string }
        resource: { type: string }
        inflight_token: { type: string }
        session_id: { type: string }
        expires_at: { type: string }
        attempts: { type: integer }
    QueueInflightList:
      type: object
      required: [inflight]
      properties:
        inflight:
          type: array
          items:
            $ref: "#/components/schemas/QueueInflight"

    QueueDeadLettersList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/QueueDeadLetter"

    QueueDeadLetter:
      type: object
      description: Live in-memory Queue dead-letter snapshot for the current broker process. Dead-letter rows remain durably stored, but this endpoint only reflects rows for queue actors that are currently warm on this broker.
      required:
        [
          message_id,
          family,
          realm,
          area,
          resource,
          dead_lettered_at,
          attempts,
          reason,
        ]
      properties:
        message_id:
          type: integer
          format: int64
        family:
          type: integer
          format: int64
        realm:
          type: string
        area:
          type: string
        resource:
          type: string
        dead_lettered_at:
          type: string
        attempts:
          type: integer
        reason:
          type: string

    NoticeSubscription:
      type: object
      description: Live in-memory Notice subscription state for the current broker process. Subscriptions are session-scoped and are removed on disconnect or broker restart.
      required: [route_family, subscription_id, session_id, realm, pattern, created_at, notifications_received]
      properties:
        route_family:
          type: integer
          format: int64
          description: Route Family where this live subscription is registered.
        subscription_id:
          type: integer
          description: Broker-local identifier for the currently active in-memory subscription.
        session_id:
          type: string
          description: Owning live session identifier. The subscription disappears when this session disconnects.
        realm:
          type: string
          description: Realm extracted from the current subscription pattern.
        pattern:
          type: string
          description: Exact route or wildcard pattern tracked in memory for the active session.
        created_at:
          type: string
          description: Timestamp when this live in-memory subscription was created. Resets after reconnect or broker restart.
        notifications_received:
          type: integer
          description: Live counter of notifications delivered to this current in-memory subscription. Not durable and resets after reconnect or broker restart.
    NoticeSubscriptionsList:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/NoticeSubscription"

    RpcWorker:
      type: object
      description: Live in-memory RPC worker registration for the current broker process. Workers must re-register after disconnect or broker restart.
      required: [route_family, session_id, realm, route, registered_at, requests_handled, average_latency_ms]
      properties:
        route_family:
          type: integer
          format: int64
          description: Route Family where this live worker is registered.
        session_id:
          type: string
          description: Broker-local worker session identifier for the active registration.
        realm:
          type: string
          description: Realm extracted from the registered RPC route.
        route:
          type: string
          description: Exact RPC operation route currently handled by this live worker registration.
        registered_at:
          type: string
          description: Timestamp when this live worker registration was created. Resets after disconnect or broker restart.
        requests_handled:
          type: integer
          description: Number of terminal RPC requests completed by this live worker registration in the current broker process.
        average_latency_ms:
          type: number
          description: Average end-to-end latency for terminal RPC requests completed by this live worker registration in the current broker process.
    RpcWorkersList:
      type: object
      required: [workers]
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/RpcWorker"

    RpcPendingRequest:
      type: object
      description: Live in-memory pending RPC request tracked by the current broker process only. Pending requests disappear on timeout, cleanup, or broker restart.
      required: [route_family, correlation_id, route, submitted_at, age_seconds, worker_session_id]
      properties:
        route_family:
          type: integer
          format: int64
          description: Route Family where this pending request is tracked.
        correlation_id:
          type: string
          description: Correlation identifier for the live in-memory request.
        route:
          type: string
          description: Exact RPC operation route for the currently pending request.
        submitted_at:
          type: string
          description: Timestamp when the current broker process accepted and tracked the request in memory.
        age_seconds:
          type: integer
          description: Approximate wall-clock age of the current in-memory pending request.
        worker_session_id:
          type: [string, "null"]
          description: Broker-local worker session currently assigned to the pending request when one is known.
    RpcPendingList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/RpcPendingRequest"

    SessionInfo:
      type: object
      properties:
        session_id: { type: string }
        route_family:
          type: integer
          description: Resolved Fitz route family for this active session.
        subject:
          type: string
          description: JWT subject for this session, when authenticated.
        identity_claim:
          type: string
          description: Claim name used for server-side route-family resolution.
        identity_value:
          type: string
          description: Claim value resolved through the broker route-family map.
        connected_at: { type: string }
        idle_seconds: { type: integer }
        messages_received: { type: integer }
        messages_sent: { type: integer }
        transport: { type: string }
        remote_addr: { type: string }
    SessionsList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: Authentication required or session invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated session is not allowed to access the requested scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource was not found, or the authorized concrete Route Family is not provisioned by this broker
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
