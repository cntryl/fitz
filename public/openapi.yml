components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fitz_admin_session
      description: Admin session JWT cookie issued by `POST /api/v1/session`.

  parameters:
    FamilyPath:
      name: family
      in: path
      required: true
      description: Provisioned Route Family id accessible to the current session, or `all` for endpoints that support cross-family admin views.
      schema:
        type: string
    RealmPath:
      name: realm
      in: path
      required: true
      schema:
        type: string
    AreaPath:
      name: area
      in: path
      required: true
      schema:
        type: string
    ResourcePath:
      name: resource
      in: path
      required: true
      schema:
        type: string
    OperationPath:
      name: operation
      in: path
      required: true
      schema:
        type: string
    RealmQuery:
      name: realm
      in: query
      required: false
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 20
        minimum: 1
        maximum: 50
    FamilyQuery:
      name: family
      in: query
      required: false
      schema:
        type: integer
        format: int64
    RouteFamilyQuery:
      name: route_family
      in: query
      required: true
      schema:
        type: integer
        format: int64
    AgainstRealmQuery:
      name: against_realm
      in: query
      required: true
      schema:
        type: string
    AgainstAreaQuery:
      name: against_area
      in: query
      required: true
      schema:
        type: string
    AgainstResourceQuery:
      name: against_resource
      in: query
      required: true
      schema:
        type: string
    AgainstFamilyQuery:
      name: against_family
      in: query
      required: false
      schema:
        type: integer
        format: int64

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    SessionResponse:
      type: object
      required:
        [
          authenticated,
          username,
          route_families,
          route_families_wildcard,
        ]
      properties:
        authenticated:
          type: boolean
        username:
          type: string
        route_families:
          type: array
          items:
            type: string
          description: Concrete provisioned Route Families accessible to this session. Wildcard sessions receive every broker-provisioned family; explicit sessions receive only their granted subset.
        route_families_wildcard:
          type: boolean
          description: True when the admin session has wildcard Route Family authority. This does not make arbitrary numeric family identifiers valid; concrete paths must name a provisioned family.

    AdminFeaturesResponse:
      type: object
      required:
        [
          admin_auth_required,
          admin_auth_mode,
          route_families,
          route_families_wildcard,
        ]
      properties:
        admin_auth_required:
          type: boolean
        admin_auth_mode:
          type: string
          enum: [protected, open]
        route_families:
          type: array
          items:
            type: string
          description: Provisioned Route Families available to public bootstrap in open mode. Empty in protected mode; use the authenticated session endpoint for admin grants after login.
        route_families_wildcard:
          type: boolean
          description: True only when public bootstrap runs with wildcard Route Family access, such as open admin mode.

    AdminSearchResponse:
      type: object
      required: [query, limit, total, truncated, results]
      properties:
        query:
          type: string
        route_family:
          type: [string, "null"]
        domain:
          type: [string, "null"]
        limit:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        truncated:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/AdminSearchResult"

    AdminSearchResult:
      type: object
      required:
        [
          id,
          domain,
          kind,
          title,
          summary,
          href,
          matched_fields,
          metadata,
        ]
      properties:
        id:
          type: string
        domain:
          type: string
        kind:
          type: string
        route_family:
          type: [string, "null"]
        realm:
          type: [string, "null"]
        area:
          type: [string, "null"]
        resource:
          type: [string, "null"]
        operation:
          type: [string, "null"]
        title:
          type: string
        summary:
          type: string
        health:
          type: [string, "null"]
        href:
          type: string
        matched_fields:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    RuntimeDrainResponse:
      type: object
      required:
        [
          lifecycle_state,
          active_sessions,
          drain_grace_seconds,
          close_reason,
        ]
      properties:
        lifecycle_state:
          type: string
          enum: [running, draining, shutting_down]
        active_sessions:
          type: integer
          format: int64
        drain_grace_seconds:
          type: integer
          format: int64
        drain_started_epoch_ms:
          type: [integer, "null"]
          format: int64
        drain_deadline_epoch_ms:
          type: [integer, "null"]
          format: int64
        close_reason:
          type: string

    StructuredMetricsResponse:
      type: object
      required: [scope, generated_at, samples]
      properties:
        scope:
          type: string
          enum: [all, family]
        family:
          type: [integer, "null"]
          format: int64
        generated_at:
          type: integer
          format: int64
          description: Unix epoch milliseconds when the snapshot was generated.
        samples:
          type: array
          items:
            $ref: "#/components/schemas/StructuredMetricSample"

    StructuredMetricSample:
      type: object
      required: [name, kind, help, labels, value]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [counter, gauge, histogram, summary]
        help:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        value:
          type: number
          format: double

    DiagnosticTrend:
      type: string
      enum: [growing, shrinking, steady, stalled, unknown]

    DiagnosticSeverity:
      type: string
      enum: [informational, low, medium, high, critical]

    IncidentStatus:
      type: string
      enum: [healthy, degraded, stalled, recovering, unknown]

    DiagnosticSnapshot:
      type: object
      required:
        [
          current_stage,
          trend,
          severity,
          recent_transition_count,
          failure_count,
          contention_count,
          waiter_count,
          confidence,
          confidence_justification,
          explanation_hints,
        ]
      properties:
        current_stage:
          type: string
        trend:
          $ref: "#/components/schemas/DiagnosticTrend"
        severity:
          $ref: "#/components/schemas/DiagnosticSeverity"
        likely_bottleneck:
          type: [string, "null"]
        last_changed_at:
          type: [string, "null"]
        last_success_at:
          type: [string, "null"]
        last_failure_at:
          type: [string, "null"]
        age_seconds:
          type: [integer, "null"]
          format: int64
        recent_transition_count:
          type: integer
          format: int64
        failure_count:
          type: integer
          format: int64
        contention_count:
          type: integer
          format: int64
        waiter_count:
          type: integer
        confidence:
          type: number
        confidence_justification:
          $ref: "#/components/schemas/ConfidenceJustification"
        explanation_hints:
          type: array
          items:
            type: string
        delta_5m:
          type: [integer, "null"]
          format: int64
        delta_1h:
          type: [integer, "null"]
          format: int64

    ConfidenceJustification:
      type: object
      required: [signals_matched, signals_missing, rationale]
      properties:
        signals_matched:
          type: array
          items:
            type: string
        signals_missing:
          type: array
          items:
            type: string
        rationale:
          type: string

    IncidentSummary:
      type: object
      required:
        [
          status,
          title,
          severity,
          confidence,
          explanation,
          recommended_next_query,
          suggested_next_queries,
        ]
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatus"
        title:
          type: string
        likely_bottleneck:
          type: [string, "null"]
        severity:
          $ref: "#/components/schemas/DiagnosticSeverity"
        confidence:
          type: number
        explanation:
          type: string
        recommended_next_query:
          type: [string, "null"]
        suggested_next_queries:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedQuery"

    SuggestedQuery:
      type: object
      required: [priority, title, endpoint, rationale, remediation]
      properties:
        priority:
          type: integer
          format: int64
        title:
          type: string
        endpoint:
          type: string
        rationale:
          type: string
        remediation:
          type: string

    DiagnosticHotspot:
      allOf:
        - $ref: "#/components/schemas/DiagnosticSnapshot"
        - type: object
          required: [domain]
          properties:
            domain:
              type: string
            realm:
              type: [string, "null"]
            area:
              type: [string, "null"]
            resource:
              type: [string, "null"]
            operation:
              type: [string, "null"]
            family:
              type: [integer, "null"]
              format: int64
            backlog:
              type: [integer, "null"]
              format: int64
            inflight:
              type: [integer, "null"]
              format: int64
            ready:
              type: [integer, "null"]
              format: int64
            delayed:
              type: [integer, "null"]
              format: int64
            dead_letters:
              type: [integer, "null"]
              format: int64
            workers:
              type: [integer, "null"]
              format: int64
            subscriptions:
              type: [integer, "null"]
              format: int64
            owner_session:
              type: [string, "null"]
            worker_session:
              type: [string, "null"]

    GlobalTroubleshootingDiagnostics:
      type: object
      required: [incident_summary, hotspots]
      properties:
        incident_summary:
          $ref: "#/components/schemas/IncidentSummary"
        top_bottleneck:
          $ref: "#/components/schemas/DiagnosticHotspot"
        last_significant_transition_at:
          type: [string, "null"]
        hotspots:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticHotspot"

    ResourceTimelineKind:
      type: string
      enum: [observation, transition, failure, retry, ownership_change, state_flip, registration]

    ResourceTimelineEvent:
      type: object
      required: [domain, kind, observed_at, summary, realm, area, resource]
      properties:
        domain:
          type: string
        kind:
          $ref: "#/components/schemas/ResourceTimelineKind"
        observed_at:
          type: string
        summary:
          type: string
        realm:
          type: string
        area:
          type: string
        resource:
          type: string
        operation:
          type: [string, "null"]
        family:
          type: [integer, "null"]
          format: int64
        age_seconds:
          type: [integer, "null"]
          format: int64
        owner_session:
          type: [string, "null"]
        worker_session:
          type: [string, "null"]
        correlation_id:
          type: [string, "null"]
        message_id:
          type: [integer, "null"]
          format: int64
        attempts:
          type: [integer, "null"]
          format: int64

    ResourceTimeline:
      type: object
      required: [domain, realm, area, resource, derived, limit, diagnostics, events]
      properties:
        domain:
          type: string
        realm:
          type: string
        area:
          type: string
        resource:
          type: string
        family:
          type: [integer, "null"]
          format: int64
        derived:
          type: boolean
        limit:
          type: integer
          format: int64
        diagnostics:
          $ref: "#/components/schemas/DiagnosticSnapshot"
