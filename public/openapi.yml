openapi: 3.1.0
info:
  title: Fitz Admin API
  version: 2.0.0
  description: |
    REST API for the Fitz admin UI.

    The admin API uses cookie-backed session authentication. Most `/api/v1/**`
    endpoints require a valid admin session cookie issued by `POST /api/v1/session`.

servers:
  - url: http://localhost:4090
    description: Local development server

tags:
  - name: Auth
  - name: Health
  - name: Metrics
  - name: Sessions
  - name: KV
  - name: Queue
  - name: Stream
  - name: Lease
  - name: Schedule
  - name: Notice
  - name: RPC

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"

  /startupz:
    get:
      tags: [Health]
      summary: Startup probe
      security: []
      responses:
        "200":
          description: Startup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupStatus"
        "503":
          description: Startup in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupStatus"

  /health:
    get:
      tags: [Health]
      summary: Legacy health endpoint
      security: []
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/session:
    post:
      tags: [Auth]
      summary: Create admin session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Session created and cookie set
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Auth]
      summary: Get current admin session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: Delete admin session
      security: []
      responses:
        "204":
          description: Session cleared and cookie removed

  /api/v1/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RealmQuery"
      responses:
