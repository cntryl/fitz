[docs]
required = [
  "README.md",
  "docs/README.md",
  "docs/user-guides/overview.md",
  "docs/user-guides/quick-start.md",
  "docs/user-guides/api-guide.md",
  "docs/development/benchmarks.md",
  "docs/operations/cloud-setup.md",
]
exclude_paths = ["skills", "ui"]

[benchmarks]
documentation = [
  "docs/development/benchmarks.md",
  "docs/development/bench-targets.md",
  "docs/operations/performance-tuning.md",
]
workflow = ".github/workflows/bench.yml"
additional_workflows = [".github/workflows/bench-tier5.yml", ".github/workflows/bench-tier6.yml"]
not_pr_gate_phrase = "not a pull-request performance gate"

[benchmarks.manual_targets]
queue_pressure = "Bounded Queue diagnostic requires an explicit resource envelope"
queue_drain_latency = "Finite Queue RESERVE and ACK timing diagnostic requires explicit invocation"
schedule_pressure = "Forced-clock Schedule diagnostic requires an explicit resource envelope"
kv_pressure = "Bounded KV cardinality diagnostic requires an explicit resource envelope"
lease_pressure = "Bounded Lease contender diagnostic requires an explicit resource envelope"

[module_sizes]
warn_lines = 1200
max_lines = 1600
allowlist = []
legacy_allowlist = []
