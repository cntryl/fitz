[docs]
required = [
  "README.md",
  "docs/README.md",
  "docs/user-guides/overview.md",
  "docs/user-guides/quick-start.md",
  "docs/user-guides/api-guide.md",
  "docs/development/benchmarks.md",
  "docs/operations/cloud-setup.md",
]
exclude_paths = ["skills", "ui"]

[benchmarks]
documentation = [
  "docs/development/benchmarks.md",
  "docs/development/bench-targets.md",
  "docs/operations/performance-tuning.md",
]
workflow = ".github/workflows/bench.yml"
not_pr_gate_phrase = "not a pull-request performance gate"

[module_sizes]
warn_lines = 1200
max_lines = 1600
allowlist = []
legacy_allowlist = []
