name: Benchmark Tier 5

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload duration (60s smoke, 600s standard, 3600s extended)
        type: choice
        options: [smoke, standard, extended]
        default: standard
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: bench-tier5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - bench: tier5_saturation
            workload: should_measure_queue_concurrency
          - bench: tier5_saturation
            workload: should_measure_kv_concurrency
          - bench: tier5_saturation
            workload: should_measure_stream_concurrency
          - bench: tier5_saturation
            workload: should_measure_schedule_concurrency
          - bench: tier5_saturation
            workload: should_measure_rpc_concurrency
          - bench: tier5_saturation
            workload: should_measure_notice_concurrency
          - bench: tier5_saturation
            workload: should_measure_lease_concurrency
          - bench: tier5_queue_drains
            workload: should_complete_queue_full_window_10k
          - bench: tier5_queue_drains
            workload: should_complete_queue_full_window_25k
          - bench: tier5_queue_drains
            workload: should_complete_queue_full_window_100k
          - bench: tier5_queue_drains
            workload: should_drain_queue_finite_10k
          - bench: tier5_queue_drains
            workload: should_drain_queue_finite_25k
          - bench: tier5_queue_drains
            workload: should_drain_queue_finite_100k
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      RUST_LOG: "off"
      FITZ_LOG_LEVEL: "off"
      OTEL_ENABLED: "false"
      STRESS_PROFILE: smoke
      STRESS_SAMPLES: "1"
      STRESS_WARMUP_SAMPLES: "0"
      STRESS_COOLDOWN_SAMPLES: "0"
      FITZ_STRESS_STORAGE_PROFILE: local_disk
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      FITZ_TIER5_DURATION_SECS: ${{ inputs.profile == 'smoke' && '60' || inputs.profile == 'standard' && '600' || '3600' }}
      STRESS_TIMEOUT_SECS: ${{ inputs.profile == 'smoke' && '960' || inputs.profile == 'standard' && '1500' || '4500' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Run benchmarks
        run: cargo bench --locked --bench '${{ matrix.bench }}' --features benchkit,stress-soak -- --workload '${{ matrix.workload }}'

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier5-${{ matrix.bench }}-${{ matrix.workload }}-${{ github.sha }}
          path: |
            target/stress/**
            target/fitz-stress/**
          if-no-files-found: ignore
