name: Benchmark Tier 5

on:
  workflow_dispatch:
    inputs:
      queue_pressure:
        description: Run matched 10k, 25k and 100k Queue drains instead of the seven one-hour sweeps
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: bench-tier5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    if: ${{ !inputs.queue_pressure }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workload:
          - should_measure_queue_concurrency
          - should_measure_kv_concurrency
          - should_measure_stream_concurrency
          - should_measure_schedule_concurrency
          - should_measure_rpc_concurrency
          - should_measure_notice_concurrency
          - should_measure_lease_concurrency
    env:
      CARGO_INCREMENTAL: "0"
      RUST_LOG: "off"
      FITZ_LOG_LEVEL: "off"
      OTEL_ENABLED: "false"
      FITZ_TIER5_DURATION_SECS: "3600"
      FITZ_STRESS_STORAGE_PROFILE: "local_disk"
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      STRESS_PROFILE: smoke
      STRESS_TIMEOUT_SECS: "4500"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Rust to stable
        run: rustup update stable

      - name: Run Tier 5 workload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fitz-stress/runner-logs
          cargo bench --locked --bench 'tier5_*' --features benchkit,stress-soak -- --workload ${{ matrix.workload }} 2>&1 | tee target/fitz-stress/runner-logs/workload.log

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-tier5-${{ matrix.workload }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/stress/**
            target/fitz-stress/**
          if-no-files-found: warn
          retention-days: 90

  queue-pressure:
    if: ${{ inputs.queue_pressure }}
    name: Matched Queue drain qualification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      FITZ_LOG_LEVEL: "off"
      RUST_LOG: "off"
      OTEL_ENABLED: "false"
      STRESS_PROFILE: smoke
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      STRESS_TIMEOUT_SECS: "1000"
      # Immutable initial instrumentation only. Do not copy later production
      # optimizations onto the comparison baseline.
      QUEUE_TIMING_COMMIT: c99b54ef50ab93b778a072219c12b15f19f7b9f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Test drain acceptance logic
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: queue-pressure
      - name: Prepare identical pacing and diagnostics on the baseline
        shell: bash
        run: |
          base=$(git merge-base HEAD origin/develop)
          baseline="$RUNNER_TEMP/fitz-queue-baseline"
          git worktree add --detach "$baseline" "$base"
          git diff --binary "$base" HEAD -- Cargo.toml Cargo.lock benches > "$RUNNER_TEMP/queue-fixtures.patch"
          git diff --binary "$base" "$QUEUE_TIMING_COMMIT" -- src/domains/queue > "$RUNNER_TEMP/queue-timing.patch"
          git -C "$baseline" apply "$RUNNER_TEMP/queue-fixtures.patch"
          git -C "$baseline" apply "$RUNNER_TEMP/queue-timing.patch"
          git -C "$baseline" add Cargo.toml Cargo.lock benches src/domains/queue
          git -C "$baseline" -c user.name=Queue-qualification -c user.email=queue-qualification@users.noreply.github.com commit --allow-empty -m 'test: identical Queue pacing and diagnostic instrumentation'
          echo "QUEUE_BASELINE=$baseline" >> "$GITHUB_ENV"
          echo "QUEUE_BASE_PRODUCTION=$base" >> "$GITHUB_ENV"
          echo "QUEUE_OUTPUT=$RUNNER_TEMP/queue-qualification" >> "$GITHUB_ENV"
      - name: Compile both sources then run all six matched campaigns
        run: python3 .github/queue_qualification.py
      - name: Upload complete and failed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-pressure-${{ github.sha }}
          path: |
            ${{ env.QUEUE_OUTPUT }}/**/*.json
            ${{ env.QUEUE_OUTPUT }}/**/run.log
            ${{ env.QUEUE_OUTPUT }}/**/stress/**
          if-no-files-found: error
          retention-days: 90
