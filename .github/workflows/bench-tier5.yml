name: Benchmark Tier 5

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select the concurrency sweeps or fixed Queue drain envelopes
        type: choice
        options: [concurrency, queue-drains]
        default: concurrency
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: bench-tier5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    if: ${{ inputs.suite != 'queue-drains' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workload:
          - should_measure_queue_concurrency
          - should_measure_kv_concurrency
          - should_measure_stream_concurrency
          - should_measure_schedule_concurrency
          - should_measure_rpc_concurrency
          - should_measure_notice_concurrency
          - should_measure_lease_concurrency
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      RUST_LOG: "off"
      FITZ_LOG_LEVEL: "off"
      OTEL_ENABLED: "false"
      FITZ_TIER5_DURATION_SECS: "3600"
      FITZ_STRESS_STORAGE_PROFILE: "local_disk"
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      STRESS_PROFILE: smoke
      STRESS_TIMEOUT_SECS: "4500"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "stress-benches"

      - name: Run Tier 5 workload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fitz-stress/runner-logs
          cargo bench --locked --bench tier5_saturation --quiet --features benchkit,stress-soak -- --workload ${{ matrix.workload }} 2>&1 | tee target/fitz-stress/runner-logs/workload.log

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-tier5-${{ matrix.workload }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/stress/**
            target/fitz-stress/**
          if-no-files-found: warn
          retention-days: 90


  queue-drains:
    if: inputs.suite == 'queue-drains'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workload:
          - should_complete_queue_full_window_10k
          - should_complete_queue_full_window_25k
          - should_complete_queue_full_window_100k
          - should_drain_queue_finite_10k
          - should_drain_queue_finite_25k
          - should_drain_queue_finite_100k
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      RUST_LOG: "off"
      FITZ_LOG_LEVEL: "off"
      OTEL_ENABLED: "false"
      STRESS_PROFILE: smoke
      STRESS_SAMPLES: "1"
      STRESS_WARMUP_SAMPLES: "0"
      STRESS_COOLDOWN_SAMPLES: "0"
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      STRESS_TIMEOUT_SECS: "1000"
      FITZ_BENCH_WORKLOAD: ${{ matrix.workload }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "stress-benches"

      - name: Run fixed Queue drain workload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fitz-stress/runner-logs
          cargo bench --locked --bench tier5_queue_drains --quiet --features benchkit,stress-soak -- --workload "$FITZ_BENCH_WORKLOAD" 2>&1 | tee target/fitz-stress/runner-logs/workload.log

      - name: Upload complete and failed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-tier5-queue-drains-${{ matrix.workload }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/stress/**
            target/fitz-stress/**
          if-no-files-found: warn
          retention-days: 90
