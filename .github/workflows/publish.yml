name: Publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  containers:
    name: Publish containers
    uses: ./.github/workflows/containers.yml
    with:
      release: true
    permissions:
      contents: read
      packages: write

  tag:
    name: Tag source
    needs:
      - containers
    if: ${{ needs.containers.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SEMVER: ${{ needs.containers.outputs.semver }}

    steps:
      - name: Checkout published source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Tag published source
        run: |
          tag="v${SEMVER}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${existing}" ]]; then
            existing="$(git ls-remote --tags origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ -n "${existing}" ]]; then
            if [[ "${existing}" == "${GITHUB_SHA}" ]]; then
              echo "Source tag ${tag} already points at ${GITHUB_SHA}"
              exit 0
            fi
            echo "Refusing to replace existing repository tag ${tag} at ${existing}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" "${GITHUB_SHA}" --message "Release ${tag}"
          git push origin "refs/tags/${tag}"
