name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Install cntryl-tools
        run: cargo install --git https://github.com/cntryl/tools --locked

      - name: Validate Test Structure
        run: cntryl-tools validate-tests

      - name: Start peas emulator
        run: docker compose -f compose.peas.yml up -d

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-features

      - name: Stop peas emulator
        if: always()
        run: docker compose -f compose.peas.yml down