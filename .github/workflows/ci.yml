name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_LOG: "off"
      FITZ_TEST_TIMEOUT_MULTIPLIER: "10"
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Pedantic lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: Test
        run: cargo test --locked --workspace

      - name: Queue diagnostic artifact regressions
        run: cargo test --locked --features benchkit,stress-soak --test queue_drain_latency_artifacts --test queue_pressure_accounting --test queue_pacing

      - name: Queue pressure acceptance regressions
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  container:
    name: Container ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      RUST_LOG: "off"
      FITZ_TEST_IMAGE: fitz-ci:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.FITZ_TEST_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=min,scope=${{ matrix.cache_scope }}

      - name: Verify default-disabled MCP in the runtime image
        timeout-minutes: 2
        run: |
          docker run --detach --name fitz-ci \
            --publish 127.0.0.1::4090 \
            --env FITZ_AUTH_REQUIRED=false \
            --env FITZ_ADMIN_AUTH_MODE=open \
            --env FITZ_STORAGE_MODE=memory \
            "${FITZ_TEST_IMAGE}"
          fitz_test_endpoint="http://$(docker port fitz-ci 4090/tcp)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "${fitz_test_endpoint}/healthz" > /tmp/fitz-container-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 2 "${fitz_test_endpoint}/healthz" \
            | jq -e '.status == "ready"'
          curl --fail --silent --show-error --max-time 2 "${fitz_test_endpoint}/api/v1/stats" \
            | jq -e '.broker and .domains'
          for path in /mcp /.well-known/oauth-protected-resource/mcp; do
            test "$(curl --silent --show-error --max-time 2 --output /dev/null --write-out '%{http_code}' "${fitz_test_endpoint}${path}")" = 404
          done

      - name: Install external driver toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache external driver dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Qualify quarter-core and 512MiB survival
        shell: bash
        timeout-minutes: 25
        env:
          FITZ_EXTERNAL_CONTAINER: fitz-resource-ci
          FITZ_RESOURCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FITZ_RESOURCE_REPORT_PATH: target/fitz-stress/constrained-runtime/report.json
        run: |
          mkdir -p target/fitz-stress/constrained-runtime
          docker run --detach --name fitz-resource-ci \
            --cpus 0.25 --memory 512m --memory-swap 512m \
            --publish 127.0.0.1::4090 --publish 127.0.0.1::4091 \
            --env FITZ_AUTH_REQUIRED=false --env FITZ_ADMIN_AUTH_MODE=open \
            --env FITZ_STORAGE_MODE=local --env FITZ_STORAGE_PATH=/data \
            --env FITZ_LOG_LEVEL=warn --env OTEL_ENABLED=false \
            "${FITZ_TEST_IMAGE}"
          export FITZ_EXTERNAL_HTTP_ENDPOINT="http://$(docker port fitz-resource-ci 4090/tcp)"
          export FITZ_EXTERNAL_TCP_ADDRESS="$(docker port fitz-resource-ci 4091/tcp)"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 "$FITZ_EXTERNAL_HTTP_ENDPOINT/healthz" | jq -e '.status == "ready"'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --max-time 2 "$FITZ_EXTERNAL_HTTP_ENDPOINT/healthz" | jq -e '.status == "ready"'
          cargo test --locked --test constrained_runtime --no-run
          docker stats --format '{{json .}}' fitz-resource-ci > target/fitz-stress/constrained-runtime/stats.jsonl &
          fitz_stats_pid=$!
          trap 'kill "$fitz_stats_pid" || true' EXIT
          cargo test --locked --test constrained_runtime \
            should_remain_usable_after_bounded_storage_pressure -- --ignored --nocapture \
            2>&1 | tee target/fitz-stress/constrained-runtime/campaign.log

      - name: Retain constrained broker evidence
        if: always()
        run: |
          mkdir -p target/fitz-stress/constrained-runtime
          docker inspect fitz-resource-ci > target/fitz-stress/constrained-runtime/container.json || true
          docker logs fitz-resource-ci > target/fitz-stress/constrained-runtime/broker.log 2>&1 || true
          if [ "${{ job.status }}" != "success" ]; then
            docker cp fitz-resource-ci:/data target/fitz-stress/constrained-runtime/failed-store || true
          fi

      - name: Upload constrained runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: constrained-runtime-${{ matrix.cache_scope }}
          path: target/fitz-stress/constrained-runtime
          if-no-files-found: warn

      - name: Remove constrained test container
        if: always()
        run: docker rm --force --volumes fitz-resource-ci || true

      - name: Show container logs on failure
        if: failure()
        run: docker logs --tail 100 fitz-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force --volumes fitz-ci || true
