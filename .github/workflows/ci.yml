name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run all benchmarks
        run: |
          BENCH_QUICK=1 BENCH_RUNS=3 cargo bench --no-fail-fast
      - name: Generate benchmark summary
        run: python3 scripts/benchmark_summary.py
      - name: Upload bench summary
        uses: actions/upload-artifact@v4
        with:
          name: bench-summary
          path: target/bench_summary.md
