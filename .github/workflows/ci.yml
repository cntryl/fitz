name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_LOG: "off"
      FITZ_TEST_TIMEOUT_MULTIPLIER: "10"
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Pedantic lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: Test
        run: cargo test --locked --workspace

      - name: Queue diagnostic artifact regressions
        run: cargo test --locked --features benchkit,stress-soak --test queue_drain_latency_artifacts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  container:
    name: Container ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      FITZ_TEST_IMAGE: fitz-ci:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.FITZ_TEST_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=min,scope=${{ matrix.cache_scope }}

      - name: Verify default-disabled MCP in the runtime image
        timeout-minutes: 2
        run: |
          docker run --detach --name fitz-ci \
            --publish 127.0.0.1::4090 \
            --env FITZ_AUTH_REQUIRED=false \
            --env FITZ_ADMIN_AUTH_MODE=open \
            --env FITZ_STORAGE_MODE=memory \
            "${FITZ_TEST_IMAGE}"
          fitz_test_endpoint="http://$(docker port fitz-ci 4090/tcp)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "${fitz_test_endpoint}/healthz" > /tmp/fitz-container-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 2 "${fitz_test_endpoint}/healthz" \
            | jq -e '.status == "ready"'
          curl --fail --silent --show-error --max-time 2 "${fitz_test_endpoint}/api/v1/stats" \
            | jq -e '.broker and .domains'
          for path in /mcp /.well-known/oauth-protected-resource/mcp; do
            test "$(curl --silent --show-error --max-time 2 --output /dev/null --write-out '%{http_code}' "${fitz_test_endpoint}${path}")" = 404
          done

      - name: Show container logs on failure
        if: failure()
        run: docker logs --tail 100 fitz-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force --volumes fitz-ci || true
