name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_LOG: "off"
      FITZ_TEST_TIMEOUT_MULTIPLIER: "10"
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Benchmark measurement acceptance regressions
        run: cargo test --locked --test workflow_qualification

      - name: Pedantic lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: Test
        run: cargo test --locked --workspace

      - name: Queue diagnostic artifact regressions
        run: cargo test --locked --features benchkit,stress-soak --test queue_drain_latency_artifacts --test queue_pressure_accounting --test queue_pacing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run

  container:
    name: Container ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      RUST_LOG: "off"
      FITZ_TEST_IMAGE: fitz-ci:${{ github.event.pull_request.head.sha || github.sha }}
      FITZ_S3_PROVIDER_IMAGE: ghcr.io/sqrzl/sqrzl-emulator@sha256:bb5bf54895fcb3b9730665b48e0f7b602791c61c3d18e5e7a060a4dce5c90964
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.FITZ_TEST_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=min,scope=${{ matrix.cache_scope }}

      - name: Verify default-disabled MCP in the runtime image
        timeout-minutes: 2
        run: |
          docker run --detach --name fitz-ci \
            --publish 127.0.0.1::4090 \
            --env FITZ_AUTH_REQUIRED=false \
            --env FITZ_ADMIN_AUTH_MODE=open \
            --env FITZ_STORAGE_MODE=memory \
            "${FITZ_TEST_IMAGE}"
          fitz_test_endpoint="http://$(docker port fitz-ci 4090/tcp)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "${fitz_test_endpoint}/healthz" > /tmp/fitz-container-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 2 "${fitz_test_endpoint}/healthz" \
            | jq -e '.status == "ready"'
          curl --fail --silent --show-error --max-time 2 "${fitz_test_endpoint}/api/v1/stats" \
            | jq -e '.broker and .domains'
          for path in /mcp /.well-known/oauth-protected-resource/mcp; do
            test "$(curl --silent --show-error --max-time 2 --output /dev/null --write-out '%{http_code}' "${fitz_test_endpoint}${path}")" = 404
          done

      - name: Install external driver toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache external driver dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci"

      - name: Qualify quarter-core and 512MiB survival
        shell: bash
        timeout-minutes: 25
        env:
          FITZ_EXTERNAL_CONTAINER: fitz-resource-ci
          FITZ_RESOURCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FITZ_RESOURCE_REPORT_PATH: target/fitz-stress/constrained-runtime/report.json
        run: |
          mkdir -p target/fitz-stress/constrained-runtime
          docker run --detach --name fitz-resource-ci \
            --cpus 0.25 --memory 512m --memory-swap 512m \
            --publish 127.0.0.1::4090 --publish 127.0.0.1::4091 \
            --env FITZ_AUTH_REQUIRED=false --env FITZ_ADMIN_AUTH_MODE=open \
            --env FITZ_STORAGE_MODE=local --env FITZ_STORAGE_PATH=/data \
            --env FITZ_LOG_LEVEL=warn --env OTEL_ENABLED=false \
            "${FITZ_TEST_IMAGE}"
          export FITZ_EXTERNAL_HTTP_ENDPOINT="http://$(docker port fitz-resource-ci 4090/tcp)"
          export FITZ_EXTERNAL_TCP_ADDRESS="$(docker port fitz-resource-ci 4091/tcp)"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 "$FITZ_EXTERNAL_HTTP_ENDPOINT/healthz" | jq -e '.status == "ready"'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --max-time 2 "$FITZ_EXTERNAL_HTTP_ENDPOINT/healthz" | jq -e '.status == "ready"'
          cargo test --locked --test constrained_runtime --no-run
          docker stats --format '{{json .}}' fitz-resource-ci > target/fitz-stress/constrained-runtime/stats.jsonl &
          fitz_stats_pid=$!
          trap 'kill "$fitz_stats_pid" || true' EXIT
          cargo test --locked --test constrained_runtime \
            should_remain_usable_after_bounded_storage_pressure -- --ignored --nocapture \
            2>&1 | tee target/fitz-stress/constrained-runtime/campaign.log

      - name: Retain constrained broker evidence
        if: always()
        run: |
          mkdir -p target/fitz-stress/constrained-runtime
          docker inspect fitz-resource-ci > target/fitz-stress/constrained-runtime/container.json || true
          docker logs fitz-resource-ci > target/fitz-stress/constrained-runtime/broker.log 2>&1 || true
          if [ "${{ job.status }}" != "success" ]; then
            docker cp fitz-resource-ci:/data target/fitz-stress/constrained-runtime/failed-store || true
          fi

      - name: Upload constrained runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: constrained-runtime-${{ matrix.cache_scope }}
          path: target/fitz-stress/constrained-runtime
          if-no-files-found: warn

      - name: Remove constrained test container
        if: always()
        run: docker rm --force --volumes fitz-resource-ci || true

      - name: Start isolated S3 qualification provider
        run: |
          aws --version
          docker network create fitz-s3-ci
          docker run --detach --name fitz-s3-provider --network fitz-s3-ci \
            --publish 127.0.0.1:9000:9000 --publish 127.0.0.1:9001:9001 \
            --env SQRZL_ACCESS_KEY_ID=admin --env SQRZL_SECRET_ACCESS_KEY=easy-peasy \
            --env SQRZL_BLOBS_PATH=/app/blobs \
            "$FITZ_S3_PROVIDER_IMAGE"
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:9001/healthz

      - name: Qualify S3 WAL retention and crash recovery at the resource floor
        shell: bash
        timeout-minutes: 85
        env:
          FITZ_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          FITZ_S3_NETWORK: fitz-s3-ci
          FITZ_S3_REPORT_DIR: target/fitz-stress/s3-recovery
          FITZ_RESOURCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p target/fitz-stress/s3-recovery
          cargo test --locked --features recovery-qualification --test constrained_runtime s3:: \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee target/fitz-stress/s3-recovery/campaign.log

      - name: Retain S3 qualification evidence
        if: always()
        run: |
          mkdir -p target/fitz-stress/s3-recovery
          docker inspect fitz-s3-provider > target/fitz-stress/s3-recovery/provider.json || true
          docker logs fitz-s3-provider > target/fitz-stress/s3-recovery/provider.log 2>&1 || true
          if [ "${{ job.status }}" != "success" ]; then
            docker cp fitz-s3-provider:/app/blobs target/fitz-stress/s3-recovery/failed-provider-store || true
          fi
          for broker in $(docker ps --all --quiet --filter label=fitz-s3-qualification=true); do
            docker inspect "$broker" > "target/fitz-stress/s3-recovery/failed-${broker}.json" || true
            docker logs "$broker" > "target/fitz-stress/s3-recovery/failed-${broker}.log" 2>&1 || true
            docker cp "$broker:/data" "target/fitz-stress/s3-recovery/failed-${broker}-cache" || true
          done

      - name: Upload S3 WAL and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3-recovery-${{ matrix.cache_scope }}
          path: target/fitz-stress/s3-recovery
          if-no-files-found: error

      - name: Remove disposable S3 qualification resources
        if: always()
        run: |
          for broker in $(docker ps --all --quiet --filter label=fitz-s3-qualification=true); do
            docker rm --force --volumes "$broker" || true
          done
          docker rm --force --volumes fitz-s3-provider || true
          docker network rm fitz-s3-ci || true

      - name: Show container logs on failure
        if: failure()
        run: docker logs --tail 100 fitz-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force --volumes fitz-ci || true
