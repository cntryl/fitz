name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install cntryl-tools
        run: cargo install --locked --git https://github.com/cntryl/tools --rev 4fd7f318c1f8c24bdb5d4bbea1b05d85b10f4bb5 cntryl-tools

      - name: Validate workspace test conventions and module sizes
        run: |
          cntryl-tools validate-tests
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[].manifest_path' \
            | while IFS= read -r manifest; do
                cntryl-tools check-module-sizes \
                  --root "$(dirname "$manifest")" \
                  --config "$PWD/.cntryl/repository.toml"
              done

      # Clippy checks benchmark targets. Benchmark contract validation needs virtual workspace support in cntryl-tools.
      - name: Lint all workspace targets and features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

  backend-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      FITZ_TEST_TIMEOUT_MULTIPLIER: "10"
      RUST_LOG: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build broker and MCP binaries
        run: cargo build --locked -p fitz --bins

      - name: Test server and library crates
        run: cargo test --locked --workspace --exclude fitz-e2e

  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      FITZ_TEST_TIMEOUT_MULTIPLIER: "10"
      RUST_LOG: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test broker integration
        run: cargo test --locked -p fitz-e2e

      - name: Queue diagnostic artifact regressions
        run: >
          cargo test --locked -p fitz-e2e --features benchkit,stress-soak
          --test queue_drain_latency_artifacts
          --test queue_pressure_accounting
          --test queue_pacing
          --test queue_pressure_envelopes

  backend:
    if: always()
    needs: [backend-checks, backend-crates, backend-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all backend jobs to pass
        env:
          BACKEND_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$BACKEND_RESULTS" = "success success success"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --run
