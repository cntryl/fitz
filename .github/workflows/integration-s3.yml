name: Integration S3

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: integration-s3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      RUST_LOG: "off"
      FITZ_TEST_IMAGE: fitz-ci:${{ github.event.pull_request.head.sha || github.sha }}
      FITZ_S3_PROVIDER_IMAGE: ghcr.io/sqrzl/sqrzl-emulator@sha256:bb5bf54895fcb3b9730665b48e0f7b602791c61c3d18e5e7a060a4dce5c90964
    services:
      fitz-s3-provider:
        image: ghcr.io/sqrzl/sqrzl-emulator@sha256:bb5bf54895fcb3b9730665b48e0f7b602791c61c3d18e5e7a060a4dce5c90964
        env:
          SQRZL_ACCESS_KEY_ID: admin
          SQRZL_SECRET_ACCESS_KEY: easy-peasy
          SQRZL_BLOBS_PATH: /app/blobs
        ports:
          - 9000:9000
          - 9001:9001
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Wait for Sqrzl
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:9001/healthz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.FITZ_TEST_IMAGE }}
          cache-from: type=gha,scope=integration-s3
          cache-to: type=gha,mode=min,scope=integration-s3

      - name: Install external driver toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache external driver dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Qualify S3 WAL retention and crash recovery at the resource floor
        shell: bash
        timeout-minutes: 85
        env:
          FITZ_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          FITZ_S3_REPORT_DIR: target/fitz-stress/s3-recovery
          FITZ_RESOURCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          aws --version
          export FITZ_S3_NETWORK="$(docker inspect '${{ job.services.fitz-s3-provider.id }}' --format '{{range $name, $config := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          mkdir -p target/fitz-stress/s3-recovery
          cargo test --locked --features recovery-qualification --test constrained_runtime s3:: \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee target/fitz-stress/s3-recovery/campaign.log

      - name: Retain S3 qualification evidence
        if: always()
        run: |
          mkdir -p target/fitz-stress/s3-recovery
          docker inspect '${{ job.services.fitz-s3-provider.id }}' > target/fitz-stress/s3-recovery/provider.json || true
          docker logs '${{ job.services.fitz-s3-provider.id }}' > target/fitz-stress/s3-recovery/provider.log 2>&1 || true
          if [ "${{ job.status }}" != "success" ]; then
            docker cp '${{ job.services.fitz-s3-provider.id }}:/app/blobs' target/fitz-stress/s3-recovery/failed-provider-store || true
          fi
          for broker in $(docker ps --all --quiet --filter label=fitz-s3-qualification=true); do
            docker inspect "$broker" > "target/fitz-stress/s3-recovery/failed-${broker}.json" || true
            docker logs "$broker" > "target/fitz-stress/s3-recovery/failed-${broker}.log" 2>&1 || true
            docker cp "$broker:/data" "target/fitz-stress/s3-recovery/failed-${broker}-cache" || true
          done

      - name: Upload S3 WAL and recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-s3
          path: target/fitz-stress/s3-recovery
          if-no-files-found: error
