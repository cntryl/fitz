name: Bench

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Benchmark suite to run"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - deep
          - all

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'release' || github.event.inputs.suite == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FITZ_LOG_LEVEL: warn
      OTEL_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Install cntryl-tools
        run: cargo install --git https://github.com/cntryl/tools --locked

      - name: Clear previous benchmark artifacts
        run: rm -rf target/stress target/bench_results.json target/bench_summary.md

      - name: Run release Tier 3 benchmarks
        run: |
          cargo bench --quiet --bench tier3_system_queue -- --workload should_complete_capacity_enqueue_isolated
          cargo bench --quiet --bench tier3_system_queue -- --workload should_complete_capacity_receive_batch_cleanup
          cargo bench --quiet --bench tier3_system_queue -- --workload should_complete_capacity_ack_roundtrip
          cargo bench --quiet --bench tier3_system_queue -- --workload should_complete_routed_ack_roundtrip
          cargo bench --quiet --bench tier3_system_rpc -- --workload should_complete_short_roundtrip_batch
          cargo bench --quiet --bench tier3_system_rpc -- --workload should_complete_single_response_throughput

      - name: Run release Tier 4 benchmarks
        run: |
          cargo bench --quiet --bench tier4_integration_kv -- --workload should_complete_direct_begin_put_rollback
          cargo bench --quiet --bench tier4_integration_kv -- --workload should_complete_tcp_begin_put_rollback
          cargo bench --quiet --bench tier4_integration_kv -- --workload should_complete_ws_begin_put_rollback
          cargo bench --quiet --bench tier4_integration_kv -- --workload should_complete_multiclient_concurrent_transactions
          cargo bench --quiet --bench tier4_integration_lease -- --workload should_complete_direct_acquire_release
          cargo bench --quiet --bench tier4_integration_lease -- --workload should_complete_tcp_acquire_release
          cargo bench --quiet --bench tier4_integration_lease -- --workload should_complete_ws_acquire_release
          cargo bench --quiet --bench tier4_integration_lease -- --workload should_complete_multiclient_acquire_release
          cargo bench --quiet --bench tier4_integration_notice -- --workload should_complete_direct_publish
          cargo bench --quiet --bench tier4_integration_notice -- --workload should_complete_tcp_publish
          cargo bench --quiet --bench tier4_integration_notice -- --workload should_complete_ws_publish
          cargo bench --quiet --bench tier4_integration_notice -- --workload should_complete_multiclient_fanout_publish
          cargo bench --quiet --bench tier4_integration_queue -- --workload should_complete_direct_enqueue
          cargo bench --quiet --bench tier4_integration_queue -- --workload should_complete_tcp_enqueue
          cargo bench --quiet --bench tier4_integration_queue -- --workload should_complete_ws_enqueue
          cargo bench --quiet --bench tier4_integration_queue -- --workload should_complete_multiclient_concurrent_enqueues
          cargo bench --quiet --bench tier4_integration_rpc -- --workload should_complete_direct_request
          cargo bench --quiet --bench tier4_integration_rpc -- --workload should_complete_tcp_request_response
          cargo bench --quiet --bench tier4_integration_rpc -- --workload should_complete_ws_request_response
          cargo bench --quiet --bench tier4_integration_rpc -- --workload should_complete_multiclient_concurrent_requests
          cargo bench --quiet --bench tier4_integration_schedule -- --workload should_complete_direct_create
          cargo bench --quiet --bench tier4_integration_schedule -- --workload should_complete_tcp_create
          cargo bench --quiet --bench tier4_integration_schedule -- --workload should_complete_ws_create
          cargo bench --quiet --bench tier4_integration_schedule -- --workload should_complete_multiclient_creates
          cargo bench --quiet --bench tier4_integration_stream -- --workload should_complete_direct_append
          cargo bench --quiet --bench tier4_integration_stream -- --workload should_complete_direct_resource_read
          cargo bench --quiet --bench tier4_integration_stream -- --workload should_complete_tcp_append
          cargo bench --quiet --bench tier4_integration_stream -- --workload should_complete_tcp_resource_read
          cargo bench --quiet --bench tier4_integration_stream -- --workload should_complete_ws_append
          cargo bench --quiet --bench tier4_integration_stream -- --workload should_complete_ws_resource_read
          cargo bench --quiet --bench tier4_integration_stream -- --workload should_complete_multiclient_appends

      - name: Filter baseline to release surface
        run: |
          jq --rawfile release_ids config/bench_release_ids.txt '
            ($release_ids
              | split("\n")
              | map(gsub("#.*$"; "") | gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0))) as $ids
            | .records = [.records[] | select(.id as $id | $ids | index($id))]
            | .comparison_summary = null
          ' config/bench_baseline.json > /tmp/bench_baseline.release.json
          test "$(jq '.records | length' /tmp/bench_baseline.release.json)" -eq "$(grep -Ev '^\s*(#|$)' config/bench_release_ids.txt | wc -l | tr -d ' ')"
          mv /tmp/bench_baseline.release.json config/bench_baseline.json

      - name: Summarize benchmark results
        run: cntryl-tools summarize-benchmarks --product-name Fitz --report-title "Fitz Benchmark Report"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-bench-artifacts-ubuntu-latest
          path: |
            target/stress/**
            target/bench_results.json
            target/bench_summary.md

  deep:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'deep' || github.event.inputs.suite == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FITZ_LOG_LEVEL: warn
      OTEL_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Install cntryl-tools
        run: cargo install --git https://github.com/cntryl/tools --locked

      - name: Clear previous benchmark artifacts
        run: rm -rf target/stress target/bench_results.json target/bench_summary.md

      - name: Run deep Tier 2 signal suites
        run: |
          cargo bench --quiet --bench tier2_subsystem_queue
          cargo bench --quiet --bench tier2_subsystem_lease
          cargo bench --quiet --bench tier2_subsystem_notice
          cargo bench --quiet --bench tier2_subsystem_rpc
          cargo bench --quiet --bench tier2_subsystem_stream
          cargo bench --quiet --bench tier2_subsystem_schedule_fire

      - name: Run deep Tier 3 scaling suites
        run: |
          cargo bench --quiet --bench tier3_system_queue
          cargo bench --quiet --bench tier3_system_rpc

      - name: Summarize benchmark results
        run: cntryl-tools summarize-benchmarks --product-name Fitz --report-title "Fitz Deep Benchmark Report"

      - name: Upload deep benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-bench-artifacts-ubuntu-latest
          path: |
            target/stress/**
            target/bench_results.json
            target/bench_summary.md
