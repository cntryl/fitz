name: Bench

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Install cntryl-tools
        run: cargo install --git https://github.com/cntryl/tools --locked

      - name: Build all benchmarks
        run: cargo bench --no-run

      - name: Run Tier 1 benchmarks (hotpath)
        run: cargo bench --bench 'tier1_*'

      - name: Run Tier 2 benchmarks (subsystem)
        run: cargo bench --bench 'tier2_*'

      - name: Run Tier 3 benchmarks (system)
        run: cargo bench --bench 'tier3_*' -- --runs 5 --warmup 1

      - name: Run Tier 4 benchmarks (integration)
        run: cargo bench --bench 'tier4_*' -- --runs 5 --warmup 1

      - name: Summarize benchmark results
        run: cntryl-tools summarize-benchmarks --product-name Fitz --report-title "Fitz Benchmark Report"

      - name: Upload Criterion artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-artifacts-${{ matrix.os }}
          path: |
            target/criterion/**
            target/stress/**
            target/bench_results.json
            target/bench_summary.md
