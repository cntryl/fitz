name: Bench

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FITZ_LOG_LEVEL: off
      OTEL_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Build benchmarks
        run: cargo bench --no-run

      - name: Benchmark tier 1
        run: cargo bench --quiet --bench 'tier1*'

      - name: Benchmark tier 2
        run: cargo bench --quiet --bench 'tier2*'

      - name: Benchmark tier 3
        run: cargo bench --quiet --bench 'tier3*'

      - name: Benchmark tier 4
        run: cargo bench --quiet --bench 'tier4*'

      - name: Upload stress benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-stress-artifacts
          path: target/stress
          if-no-files-found: ignore
