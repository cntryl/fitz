name: Bench

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FITZ_LOG_LEVEL: off
      OTEL_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Install cntryl-tools
        run: cargo install --locked --git https://github.com/cntryl/tools --rev b2a06b1a635de752803f5860339fc3cecbc19742 cntryl-tools

      - name: Validate benchmark contract
        run: cntryl-tools validate-benchmarks

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Build benchmarks
        run: cargo bench --no-run

      - name: Benchmark tier 1
        run: cargo bench --bench 'tier1*' --quiet

      - name: Benchmark tier 2
        run: cargo bench --bench 'tier2*' --quiet

      - name: Benchmark tier 3
        run: cargo bench --bench 'tier3*' --quiet

      - name: Benchmark tier 4
        run: cargo bench --bench 'tier4*' --quiet

      - name: Upload stress benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-stress-artifacts
          path: target/stress
          if-no-files-found: ignore
