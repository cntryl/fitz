name: Bench

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Build all benchmarks
        run: cargo bench --no-run

      - name: Run Tier 1 benchmarks (hotpath)
        run: cargo bench --bench 'tier1_*'
        env:
          RAYON_NUM_THREADS: 4

      - name: Run Tier 2 benchmarks (subsystem)
        run: cargo bench --bench 'tier2_*'
        env:
          RAYON_NUM_THREADS: 4

      - name: Run Tier 3 benchmarks (system)
        run: cargo bench --bench 'tier3_*'
        env:
          RAYON_NUM_THREADS: 4

      - name: Run Tier 4 benchmarks (integration)
        run: cargo bench --bench 'tier4_*'
        env:
          RAYON_NUM_THREADS: 4

      - name: Upload Criterion artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-artifacts-${{ matrix.os }}
          path: |
            target/criterion/**
            target/stress/**
