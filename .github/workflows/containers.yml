name: Containers

on:
  workflow_dispatch:

concurrency:
  group: containers
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    uses: ./.github/workflows/version.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set platform pair
        id: platform
        run: echo "platform_pair=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.platform_pair }}
          cache-to: type=gha,mode=min,scope=${{ steps.platform.outputs.platform_pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        env:
          BRANCH: ${{ needs.version.outputs.branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          tags=()
          semver_tag=""
          inspect_tag=""

          if [[ "${REF_TYPE}" == "branch" ]]; then
            tags+=(-t "${image}:${BRANCH}")
            inspect_tag="${BRANCH}"
          fi

          if [[ "${SEMVER}" == *-* ]]; then
            semver_tag="${image}:${SEMVER}"
          elif [[ "${REF_TYPE}" == "tag" && "${REF_NAME#v}" == "${SEMVER}" ]]; then
            semver_tag="${image}:${SEMVER}"
          else
            echo "Skipping stable SemVer alias ${SEMVER}; ${REF_NAME} is not a matching Git tag"
          fi

          if [[ "${BRANCH}" == "main" ]]; then
            tags+=(-t "${image}:latest")
          fi

          sources=()
          for digest in *; do
            sources+=("${image}@sha256:${digest}")
          done

          if [[ -n "${semver_tag}" ]]; then
            inspect_tag="${SEMVER}"
            docker buildx imagetools create --dry-run "${sources[@]}" > /tmp/proposed-manifest.json

            if docker buildx imagetools inspect --raw "${semver_tag}" > /tmp/published-manifest.json 2>/dev/null; then
              jq --sort-keys --compact-output . /tmp/proposed-manifest.json > /tmp/proposed-manifest.canonical.json
              jq --sort-keys --compact-output . /tmp/published-manifest.json > /tmp/published-manifest.canonical.json

              if ! cmp --silent /tmp/proposed-manifest.canonical.json /tmp/published-manifest.canonical.json; then
                echo "Refusing to replace immutable SemVer tag ${semver_tag}" >&2
                exit 1
              fi
              echo "SemVer tag ${semver_tag} already points at this manifest"
            else
              tags+=(-t "${semver_tag}")
            fi
          fi

          if [[ -z "${inspect_tag}" ]]; then
            echo "No publishable container tag for ${REF_TYPE} ref ${REF_NAME}" >&2
            exit 1
          fi

          if (( ${#tags[@]} > 0 )); then
            docker buildx imagetools create \
              "${tags[@]}" \
              "${sources[@]}"
          fi

          echo "inspect_tag=${inspect_tag}" >> "${GITHUB_OUTPUT}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.manifest.outputs.inspect_tag }}
