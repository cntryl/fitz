name: Containers

on:
  # Keep the moving development images synchronized with protected main. Stable
  # SemVer tags remain an explicit release operation below.
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Publish a stable SemVer image from main
        required: false
        type: boolean
        default: false
    outputs:
      semver:
        description: SemVer calculated for the workflow
        value: ${{ jobs.version.outputs.semver }}

concurrency:
  group: containers
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    uses: ./.github/workflows/version.yml

  validate:
    name: Validate publish request
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      reuse: ${{ steps.release-state.outputs.reuse }}
    env:
      RELEASE: ${{ inputs.release }}
      SEMVER: ${{ needs.version.outputs.semver }}

    steps:
      - name: Require a version
        run: |
          if [[ -z "${SEMVER}" ]]; then
            echo "GitVersion returned an empty SemVer" >&2
            exit 1
          fi

          if [[ "${RELEASE}" != "true" && "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Standalone container publishing requires a branch ref" >&2
            exit 1
          fi

      - name: Checkout release source
        if: ${{ inputs.release }}
        uses: actions/checkout@v7

      - name: Validate stable release state
        id: release-state
        run: |
          echo "reuse=false" >> "$GITHUB_OUTPUT"

          if [[ "${RELEASE}" != "true" ]]; then
            exit 0
          fi

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Publishing is allowed only from main; received ${GITHUB_REF}" >&2
            exit 1
          fi

          tag="v${SEMVER}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "${existing}" ]]; then
            existing="$(git ls-remote --tags origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')"
          fi

          if [[ -n "${existing}" && "${existing}" != "${GITHUB_SHA}" ]]; then
            echo "Refusing to publish existing repository tag ${tag} at ${existing}; expected ${GITHUB_SHA}" >&2
            exit 1
          fi

          if [[ "${existing}" == "${GITHUB_SHA}" ]]; then
            echo "Stable release ${tag} already points at ${GITHUB_SHA}; reusing its image"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    if: ${{ needs.validate.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set platform pair
        id: platform
        run: echo "platform_pair=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.platform_pair }}
          cache-to: type=gha,mode=min,scope=${{ steps.platform.outputs.platform_pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs:
      - version
      - validate
      - build
    if: ${{ always() && needs.validate.result == 'success' && (needs.validate.outputs.reuse == 'true' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare digest workspace
        run: mkdir -p /tmp/digests

      - name: Download digests
        if: ${{ needs.validate.outputs.reuse != 'true' }}
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        env:
          REF: ${{ github.ref }}
          RELEASE: ${{ inputs.release }}
          REUSE: ${{ needs.validate.outputs.reuse }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          tags=()
          semver_tag=""
          inspect_tag=""

          if [[ "${REUSE}" == "true" ]]; then
            inspect_tag="${SEMVER}"
            echo "Reusing the existing stable image ${image}:${SEMVER}"
            echo "inspect_tag=${inspect_tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${RELEASE}" == "true" || "${SEMVER}" == *-* ]]; then
            semver_tag="${image}:${SEMVER}"
          else
            echo "Skipping stable SemVer alias ${SEMVER}; use the Publish workflow to release it"
          fi

          if [[ "${REF}" == "refs/heads/main" ]]; then
            tags+=(-t "${image}:main" -t "${image}:latest")
            inspect_tag="latest"
          fi

          sources=()
          for digest in *; do
            sources+=("${image}@sha256:${digest}")
          done

          if [[ -n "${semver_tag}" ]]; then
            inspect_tag="${SEMVER}"
            docker buildx imagetools create --dry-run "${sources[@]}" > /tmp/proposed-manifest.json

            if docker buildx imagetools inspect --raw "${semver_tag}" > /tmp/published-manifest.json 2>/dev/null; then
              jq --sort-keys --compact-output . /tmp/proposed-manifest.json > /tmp/proposed-manifest.canonical.json
              jq --sort-keys --compact-output . /tmp/published-manifest.json > /tmp/published-manifest.canonical.json

              if ! cmp --silent /tmp/proposed-manifest.canonical.json /tmp/published-manifest.canonical.json; then
                echo "Refusing to replace immutable SemVer tag ${semver_tag}" >&2
                exit 1
              fi
              echo "SemVer tag ${semver_tag} already points at this manifest"
            else
              tags+=(-t "${semver_tag}")
            fi
          fi

          if [[ -z "${inspect_tag}" ]]; then
            echo "No publishable container tag for ${REF}" >&2
            exit 1
          fi

          if (( ${#tags[@]} > 0 )); then
            docker buildx imagetools create \
              "${tags[@]}" \
              "${sources[@]}"
          fi

          echo "inspect_tag=${inspect_tag}" >> "${GITHUB_OUTPUT}"

      - name: Inspect image
        env:
          INSPECT_TAG: ${{ steps.manifest.outputs.inspect_tag }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${INSPECT_TAG}"
          docker buildx imagetools inspect "${image}"

          # A successful manifest push is not enough: both published runtime
          # architectures must be present before this workflow is green.
          docker buildx imagetools inspect --raw "${image}" \
            | jq -e '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .platform.architecture] | sort == ["amd64", "arm64"]'
