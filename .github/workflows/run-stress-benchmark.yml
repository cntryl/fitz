name: Run stress benchmark

on:
  workflow_call:
    inputs:
      bench:
        type: string
        required: true
      workload:
        type: string
        required: true
      profile:
        type: string
        required: true
      artifact_name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      BENCH_NAME: ${{ inputs.bench }}
      WORKLOAD_NAME: ${{ inputs.workload }}
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_INCREMENTAL: "0"
      RUST_LOG: "off"
      FITZ_LOG_LEVEL: "off"
      OTEL_ENABLED: "false"
      STRESS_OUTPUT_DIR: ${{ github.workspace }}/target/stress
      STRESS_PROFILE: smoke
      STRESS_SAMPLES: "1"
      STRESS_WARMUP_SAMPLES: "0"
      STRESS_COOLDOWN_SAMPLES: "0"
      FITZ_STRESS_STORAGE_PROFILE: local_disk
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      # Scheduled runs use the full settings.
      FITZ_TIER5_DURATION_SECS: ${{ inputs.profile == 'smoke' && '60' || inputs.profile == 'standard' && '600' || '3600' }}
      FITZ_TIER6_DURATION_SECS: ${{ inputs.profile == 'smoke' && '60' || inputs.profile == 'standard' && '600' || '3600' }}
      STRESS_TIMEOUT_SECS: ${{ inputs.profile == 'smoke' && '960' || inputs.profile == 'standard' && '1500' || '4500' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-release-stress-soak

      - name: Run benchmark
        run: cargo bench --locked -p fitz-e2e --bench "$BENCH_NAME" --features benchkit,stress-soak -- --workload "$WORKLOAD_NAME"

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            target/stress/**
            target/fitz-stress/**
          if-no-files-found: warn
