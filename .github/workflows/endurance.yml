name: Benchmark Tier 6 Endurance
run-name: Endurance benchmarks (${{ inputs.profile || 'extended' }})

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload duration (60s smoke, 600s standard, 3600s extended)
        type: choice
        options: [smoke, standard, extended]
        default: standard
  schedule:
    - cron: "0 7 1 * *"

permissions:
  contents: read

concurrency:
  group: bench-tier6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        workload:
          - should_soak_queue
          - should_soak_kv
          - should_soak_stream
          - should_soak_schedule
          - should_soak_rpc
          - should_soak_notice
          - should_soak_lease
    uses: ./.github/workflows/run-stress-benchmark.yml
    with:
      bench: tier6_endurance
      workload: ${{ matrix.workload }}
      profile: ${{ inputs.profile || 'extended' }}
      artifact_name: bench-tier6-${{ matrix.workload }}-${{ github.sha }}
