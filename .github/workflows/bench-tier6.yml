name: Benchmark Tier 6

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 * *"

permissions:
  contents: read

concurrency:
  group: bench-tier6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workload:
          - should_soak_queue
          - should_soak_kv
          - should_soak_stream
          - should_soak_schedule
          - should_soak_rpc
          - should_soak_notice
          - should_soak_lease
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      RUST_LOG: "off"
      FITZ_LOG_LEVEL: "off"
      OTEL_ENABLED: "false"
      FITZ_TIER6_DURATION_SECS: "3600"
      FITZ_STRESS_STORAGE_PROFILE: "local_disk"
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      STRESS_PROFILE: smoke
      STRESS_TIMEOUT_SECS: "4500"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "stress-benches"

      - name: Run Tier 6 workload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/fitz-stress/runner-logs
          cargo bench --locked --bench 'tier6_*' --features benchkit,stress-soak -- --workload ${{ matrix.workload }} 2>&1 | tee target/fitz-stress/runner-logs/workload.log

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-tier6-${{ matrix.workload }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/stress/**
            target/fitz-stress/**
          if-no-files-found: warn
          retention-days: 90
