name: Benchmark Tier 1

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: bench-tier1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_INCREMENTAL: "0"
      RUST_LOG: "off"
      FITZ_LOG_LEVEL: "off"
      OTEL_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Run registered Tier 1 targets
        run: cargo bench --locked --bench 'tier1_*' --quiet

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/stress/**
          if-no-files-found: warn
          retention-days: 90
