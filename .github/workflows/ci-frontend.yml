name: CI Frontend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-frontend.yml
      - ui/**
  pull_request:
    paths:
      - .github/workflows/ci-frontend.yml
      - ui/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Check generated adapters
        run: npm run check:generated

      - name: UI tests
        run: npm run test -- --run

      - name: UI lint
        run: npm run lint

      - name: UI type check
        run: npm run type-check

      - name: UI build
        run: npm run build

      - name: Install Playwright browser
        run: npm run install:browsers

      - name: Playwright route suite
        run: npm run test:e2e

      - name: Playwright visual regression suite
        run: npm run test:visual

      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fitz-ui-visual-regression
          path: |
            ui/test-results/**
            ui/playwright-report/**
          if-no-files-found: ignore

      - name: Build-only container validation
        working-directory: .
        run: docker build --target frontend --tag fitz-ui-build .
