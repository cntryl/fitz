name: Version

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      semver:
        description: Fitz package version from Cargo.toml
        value: ${{ jobs.version.outputs.semver }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      semver: ${{ steps.package-version.outputs.semver }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read package version from Cargo.toml
        id: package-version
        run: |
          semver="$(cargo metadata --no-deps --format-version 1 \
            | jq -er '[.packages[] | select(.name == "fitz")] | if length == 1 then .[0].version else error("expected exactly one fitz package") end')"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "Using Cargo package version ${semver}"
