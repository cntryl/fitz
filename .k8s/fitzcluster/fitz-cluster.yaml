            - name: FITZ_TCP_PORT
              value: "7072"
            - name: CONTROL_ROUTE
              value: "http://control:8080/connect"
            - name: CONTROL_CLIENT_ID
              value: "broker"
            - name: BROKER_ENFORCE_AUTHZ
              value: "false"
            - name: RUST_LOG
              value: "info,fitz=debug"
          startupProbe:
            httpGet:
              path: /startupz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2

---
apiVersion: v1
kind: Service
metadata:
  name: broker-1
  namespace: fitz
spec:
  type: NodePort
  selector:
    app: broker-1
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081

