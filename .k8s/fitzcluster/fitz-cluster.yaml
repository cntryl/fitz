# Notes:
# - The manifests reference image `fitz:latest`. Build the image locally so the
#   Docker Desktop Kubernetes cluster can use it, for example from the repo root:
#     docker build -t fitz:latest -f Dockerfile .
# - Apply the manifests:
#     kubectl apply -f .k8s/fitzcluster/fitz-cluster.yaml
# - Services are exposed as NodePorts 30080-30083 so they are reachable on the
#   host. Alternatively use `kubectl port-forward` for individual services.