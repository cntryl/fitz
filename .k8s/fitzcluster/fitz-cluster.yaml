apiVersion: v1
kind: Namespace
metadata:
  name: fitz

---
# Control deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  namespace: fitz
  labels:
    app: control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control
  template:
    metadata:
      labels:
        app: control
    spec:
      containers:
        - name: control
          image: fitz:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: FITZ_WS_PORT
              value: "8080"
            - name: FITZ_TCP_PORT
              value: "7071"
            - name: CONTROL_ROUTE
              value: "/connect"
            - name: BROKER_ENFORCE_AUTHZ
              value: "false"
            - name: RUST_LOG
              value: "info,fitz=debug"
          startupProbe:
            httpGet:
              path: /startupz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2

---
apiVersion: v1
kind: Service
metadata:
  name: control
  namespace: fitz
spec:
  type: NodePort
  selector:
    app: control
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

---
# Broker 1 (pod spec identical to broker-2 and broker-3)
