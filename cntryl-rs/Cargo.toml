[package]
name = "cntryl"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "time", "sync"] }
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio-tungstenite = "0.21"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
