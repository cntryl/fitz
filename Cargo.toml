[workspace]
resolver = "2"
members = [
    "crates/fitz-core",
    "crates/fitz-storage",
    "crates/fitz-kv",
    "crates/fitz-lease",
    "crates/fitz-notice",
    "crates/fitz-queue",
    "crates/fitz-rpc",
    "crates/fitz-schedule",
    "crates/fitz-stream",
    "crates/fitz-server",
    "crates/fitz-e2e",
]
default-members = ["crates/fitz-server"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/cntryl/fitz"

[workspace.lints.clippy]
pedantic = "deny"

[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
ahash = "0.8"
argon2 = "0.6"
async-trait = "0.1"
base64 = "0.23.1"
brotli = "9"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
cntryl-midge = "0.5.3"
crossbeam-channel = "0.5"
dashmap = "6.2.1"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-tungstenite = "0.30"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs", "use_pem"] }
lexkey = { package = "cntryl-lexkey", version = "0.1.0" }
libc = "0.2"
lz4_flex = "0.14.2"
num-traits = "0.2"
once_cell = "1.21"
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "trace"] }
parking_lot = "0.13"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.11.0", default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
rustc-hash = "2.1.3"
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
socket2 = "0.6"
smallvec = "1.16"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt", "json"] }
tungstenite = "0.30"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
cntryl-stress = "0.5.1"
crc32c = "0.6"
jsonschema = { version = "0.62.0", default-features = false }
proptest = "1"
serial_test = "4.0.1"

fitz-core = { path = "crates/fitz-core", version = "0.5.1" }
fitz-storage = { path = "crates/fitz-storage", version = "0.5.1" }
fitz-kv = { path = "crates/fitz-kv", version = "0.5.1" }
fitz-lease = { path = "crates/fitz-lease", version = "0.5.1" }
fitz-notice = { path = "crates/fitz-notice", version = "0.5.1" }
fitz-queue = { path = "crates/fitz-queue", version = "0.5.1" }
fitz-rpc = { path = "crates/fitz-rpc", version = "0.5.1" }
fitz-schedule = { path = "crates/fitz-schedule", version = "0.5.1" }
fitz-stream = { path = "crates/fitz-stream", version = "0.5.1" }
fitz = { path = "crates/fitz-server", version = "0.5.1" }
