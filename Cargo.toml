[[bench]]
name = "tier2_subsystem_schedule_churn"
harness = false
path = "benches/tier2_subsystem_schedule_churn.rs"

[[bench]]
name = "tier2_subsystem_schedule_fire"
harness = false
path = "benches/tier2_subsystem_schedule_fire.rs"

[[bench]]
name = "tier2_subsystem_queue"
harness = false
path = "benches/tier2_subsystem_queue.rs"

[[bench]]
name = "tier2_subsystem_rpc"
harness = false
path = "benches/tier2_subsystem_rpc.rs"

[[bench]]
name = "tier2_subsystem_lease"
harness = false
path = "benches/tier2_subsystem_lease.rs"

[[bench]]
name = "tier2_subsystem_notice"
harness = false
path = "benches/tier2_subsystem_notice.rs"

[[bench]]
name = "tier2_subsystem_stream"
harness = false
path = "benches/tier2_subsystem_stream.rs"

[[bench]]
name = "tier2_subsystem_stream_replay"
harness = false
