path = "benches/tier4_integration_stream.rs"

[[bench]]
name = "tier4_integration_stream_storage_model"
harness = false
path = "benches/tier4_integration_stream_storage_model.rs"

[features]
# Feature flag to skip admin snapshot syncing in RPC domain for benchmarking
# Helps identify if snapshot overhead is the dominant bottleneck in scaling collapse
bench-no-snapshot = []
