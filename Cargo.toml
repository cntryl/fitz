name = "hotpath_tlv_core"
harness = false
path = "benches/hotpath/tlv_core.rs"

[[bench]]
name = "hotpath_kv_core"
harness = false
path = "benches/hotpath/kv_core.rs"

[[bench]]
name = "hotpath_notice_core"
harness = false
path = "benches/hotpath/notice_core.rs"

[[bench]]
name = "hotpath_queue_core"
harness = false
