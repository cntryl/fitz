[package]
name = "fitz"
version = "0.0.1"
edition = "2021"
authors = ["smiggleworth"]
description = "The messaging layer your system was missing"
repository = "https://github.com/cntryl/fitz"
keywords = ["database", "kv", "lsm", "embedded", "storage"]
categories = ["message-broker"]
 
[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
tokio-tungstenite = "0.20"
tungstenite = "0.20"
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.4"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
jsonwebtoken = "8"
sha1 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
hyper-tungstenite = "0.6"
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"
futures-util = "0.3"
url = "2"
quinn = "0.11"
rustls-native-certs = "0.7"
rcgen = "0.12"
crc32fast = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# Lock-free / concurrency crates used by lease service
crossbeam-epoch = "0.9"
crossbeam-queue = "0.3"
crossbeam-skiplist = "0.1"
crossbeam-channel = "0.5"
fxhash = "0.2"
num_cpus = "1.15"
dashmap = "5"
parking_lot = "0.12"
smallvec = "1.13"
bincode = "1.3"
tempfile = "3"
cntryl-midge = { git = "https://github.com/cntryl/midge", branch = "main", features = ["testkit"] }
cntryl-lexkey = { git = "https://github.com/cntryl/lexkey-rs", branch = "main" }

[dev-dependencies]
url = "2"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
regex = "1"
criterion = { version = "0.4", features = ["async_futures"] }
serial_test = "0.5"
tempfile = "3"
rand = "0.8"

# Note: Benchmarks will be added as persona actors are implemented
