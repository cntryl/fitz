[package]
name = "fitz"
version = "0.5.0"
edition = "2021"
autobenches = false
license-file = "LICENSE"
authors = ["smiggleworth"]
description = "The messaging layer your system was missing"
repository = "https://github.com/cntryl/fitz"
documentation = "https://github.com/cntryl/fitz/blob/main/README.md"
keywords = ["broker", "kv", "messaging", "queue", "stream"]
categories = ["message-broker"]

[workspace]
resolver = "2"

[workspace.lints.clippy]
pedantic = "deny"

[lints]
workspace = true

[features]
# Skip non-forced RPC and Schedule admin snapshot updates during benchmarks.
bench-no-snapshot = []
# Compile benchmark-only library adapters that intentionally bypass transport.
benchkit = []
# Opt in to long-running saturation and endurance benchmark targets.
stress-soak = []
# Expose pinned Midge fixture codecs only to the external recovery driver.
recovery-qualification = ["cntryl-midge/internal-testing"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
ahash = "0.8"
argon2 = "0.6"
async-trait = "0.1"
base64 = "0.23.1"
brotli = "9"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
cntryl-midge = "0.5.3"
crossbeam-channel = "0.5"
dashmap = "6.2.1"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-tungstenite = "0.30"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs", "use_pem"] }
lexkey = { package = "cntryl-lexkey", version = "0.1.0" }
libc = "0.2"
lz4_flex = "0.14.2"
num-traits = "0.2"
once_cell = "1.21"
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "trace"] }
parking_lot = "0.13"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.11.0", default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
rustc-hash = "2.1.3"
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
socket2 = "0.6"
smallvec = "1.16"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt", "json"] }
tungstenite = "0.30"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
cntryl-stress = "0.5.1"
crc32c = "0.6"
jsonschema = { version = "0.61.2", default-features = false }
proptest = "1"
serial_test = "4.0.1"
tokio = { version = "1", features = ["test-util"] }

