# Tier 4: Integration (Full TCP/WS to domain, full stack - one per domain)
[[bench]]
name = "tier4_integration_kv"
harness = false
path = "benches/tier4_integration_kv.rs"

[[bench]]
name = "tier4_integration_lease"
harness = false
path = "benches/tier4_integration_lease.rs"

[[bench]]
name = "tier4_integration_notice"
harness = false
