[package]
name = "fitz"
version = "0.1.0"
edition = "2021"
authors = ["smiggleworth"]
description = "A high-performance message broker"
repository = "https://github.com/cntryl/fitz"
keywords = ["database", "kv", "lsm", "embedded", "storage"]
categories = ["message-broker"]
 
[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
tokio-tungstenite = "0.20"
tungstenite = "0.20"
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.4"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
sha1 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hyper-tungstenite = "0.6"
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"
futures-util = "0.3"
url = "2"
crc32fast = "1"

[dev-dependencies]
url = "2"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
regex = "1"
criterion = { version = "0.4", features = ["async_futures"] }

[[bench]]
name = "hotpath_lease"
harness = false
path = "benches/hotpath/lease.rs"
