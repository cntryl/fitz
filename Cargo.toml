# Tier 3: System (Domain + plumbing, <10s, sync only - one per domain)
[[bench]]
name = "tier3_system_kv"
harness = false
path = "benches/tier3_system_kv.rs"

[[bench]]
name = "tier3_system_lease"
harness = false
path = "benches/tier3_system_lease.rs"

[[bench]]
name = "tier3_system_notice"
harness = false
path = "benches/tier3_system_notice.rs"

[[bench]]
name = "tier3_system_queue"
harness = false
path = "benches/tier3_system_queue.rs"

[[bench]]
name = "tier3_system_rpc"
harness = false
path = "benches/tier3_system_rpc.rs"

[[bench]]
name = "tier3_system_schedule"
harness = false
path = "benches/tier3_system_schedule.rs"

[[bench]]
